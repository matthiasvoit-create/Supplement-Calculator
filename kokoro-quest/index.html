<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kokoro Quest – Mut wächst in kleinen Schritten</title>
<meta name="description" content="Kokoro Quest: gamifizierte Selbsthilfe-Übungen gegen Angst und Panik. Alle Daten bleiben im Browser.">

<!-- Zum Startbildschirm hinzufügen: Manifest, Symbole, Statusleistenfarbe.
     Beim Öffnen als Einzeldatei laufen diese Verweise ins Leere – das
     stört nicht, die App funktioniert unverändert. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#A0D8F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#241C38" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kokoro Quest">
<!--
  ============================================================================
  KOKORO QUEST  ·  Eine einzelne HTML-Datei. Kein Build, keine Abhängigkeiten,
  keine Netzwerk-Requests, kein Tracking. Doppelklick genügt.
  ----------------------------------------------------------------------------
  Aufbau der Datei:
    1) <style>        Design-System, Tokens, Komponenten, Dark Mode, Motion
    2) <body>         App-Hülle: Kopf, Screens, Krisenleiste, Panik-Button
    3) <script>
       §A  INHALTE    Texte, Notfallkontakte, Quests, Wissenskarten,
                      Coping-Sätze, Achievements, Level  ← hier gefahrlos
                      editierbar, ohne Logikwissen
       §B  STATE      Datenmodell, localStorage, migrate()
       §C  LOGIK      Spielschleife, Punkte, Serie, Level-Ups
       §D  AVATAR     Sieben Inline-SVG-Stufen
       §E  RENDER     Screens
       §F  TOOLS      Atem, Timer, Journalformulare, Diagramme
       §G  START      Router & Initialisierung
  ============================================================================
-->
<style>
/* =========================================================================
   1. DESIGN-TOKENS  ·  Tokyo-Pop-Pastell
   ========================================================================= */
:root{
  color-scheme:light dark;
  /* Markenfarben hell */
  --sakura:#FFB7C5;
  --mint:#A8E6CF;
  --himmel:#A0D8F1;
  --lavendel:#C9B6E4;
  --butter:#FFE79A;
  --koralle:#FF8FA3;
  --tinte:#3B3054;           /* nie #000 */
  --ink:#3B3054;             /* Outline-Farbe für die Figur */
  --ink-dunkel:#3B3054;      /* Kontur AUF Pastellflächen – in beiden Modi dunkel */

  /* Semantische Rollen hell */
  --bg:#FFF8F3;
  --bg-deko:#FFEDE4;
  --surface:#FFFFFF;
  --surface-2:#FFF1EA;
  --line:#EBD9D0;
  --text:#3B3054;
  --text-muted:#5A4C77;
  --accent:#FF8FA3;
  --accent-ink:#3B3054;
  --focus:#2F6FB5;
  --shadow:0 6px 0 rgba(59,48,84,.10), 0 10px 24px rgba(59,48,84,.10);
  --shadow-sm:0 3px 0 rgba(59,48,84,.08), 0 6px 14px rgba(59,48,84,.08);

  /* Attributfarben */
  --at-koerper:#FF8FA3;
  --at-geist:#7FC6EA;
  --at-mut:#B79BE0;
  --at-verbundenheit:#F0C64B;

  /* Y2K: Fenster sind eckiger als Buttons – die Rundung lebt in Pillen,
     Stickern und der Figur weiter. */
  --radius:12px;
  --radius-sm:9px;
  --radius-pille:999px;
  --chrome-a:#A0D8F1;        /* Titelleiste links  */
  --chrome-b:#FFB7C5;        /* Titelleiste rechts */
  --y2k-grid:rgba(59,48,84,.10);
  --hart:4px 4px 0 var(--ink-dunkel);
  --hart-klein:3px 3px 0 var(--ink-dunkel);
  --outline:3px;
  --maxw:620px;
  --font:"Hiragino Maru Gothic ProN","Quicksand","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --sakura:#E6A2B2;
    --mint:#8FCBB5;
    --himmel:#8CC0DC;
    --lavendel:#B3A1D0;
    --butter:#E8D294;
    --koralle:#E88FA0;
    --ink:#F3EEFF;
    --bg:#241C38;
    --bg-deko:#2C2244;
    --surface:#2F2648;
    --surface-2:#3A2F58;
    --line:#4B3E70;
    --text:#F3EEFF;
    --text-muted:#C9BEE6;
    --accent:#E6A2B2;
    --accent-ink:#241C38;
    --focus:#9AD1FF;
    --shadow:0 6px 0 rgba(0,0,0,.25), 0 10px 24px rgba(0,0,0,.35);
    --shadow-sm:0 3px 0 rgba(0,0,0,.22), 0 6px 14px rgba(0,0,0,.28);
    --chrome-a:#6E8FC0;
    --chrome-b:#B57C97;
    --y2k-grid:rgba(243,238,255,.07);
    --hart:4px 4px 0 #120C1F;
    --hart-klein:3px 3px 0 #120C1F;
    --at-koerper:#F09FAE;
    --at-geist:#8CC0DC;
    --at-mut:#B9A6DE;
    --at-verbundenheit:#E8CE7E;
    --neon:#7CF5D2;          /* Neon-Akzent nur für Level-Ups */
  }
}

/* =========================================================================
   2. GRUNDLAYOUT
   ========================================================================= */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
  overflow-x:hidden;              /* nie horizontal scrollen */
}
body::before{                      /* Y2K-Grund: Verlauf, feines Raster, Halbton */
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 12% 14%, var(--sakura) 0 2px, transparent 2.5px) 0 0/18px 18px,
    linear-gradient(var(--y2k-grid) 1px, transparent 1px) 0 0/26px 26px,
    linear-gradient(90deg, var(--y2k-grid) 1px, transparent 1px) 0 0/26px 26px,
    linear-gradient(160deg, var(--himmel) 0%, var(--bg) 38%, var(--bg) 62%, var(--sakura) 130%);
  opacity:.55;
}
@media (prefers-color-scheme: dark){ body::before{opacity:.32} }
img,svg{max-width:100%}
h1,h2,h3{font-weight:800;line-height:1.25;margin:0 0 .4em}
h1{font-size:1.5rem;letter-spacing:.01em;text-shadow:2.5px 2.5px 0 var(--butter)}
@media (prefers-color-scheme: dark){h1{text-shadow:2.5px 2.5px 0 rgba(201,182,228,.45)}}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0 0 .8em}
a{color:var(--text);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}

/* Seitliche Polsterung berücksichtigt die Kerbe im Querformat. */
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;
  padding-inline:max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right))}
.app{padding-block:0 calc(170px + env(safe-area-inset-bottom))}        /* Platz für Navigation + Krisenleiste */
.stack>*+*{margin-top:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.center{text-align:center}
.muted{color:var(--text-muted)}
.small{font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}

/* =========================================================================
   3. KOPFZEILE
   ========================================================================= */
.appbar{
  position:sticky;top:0;z-index:30;
  padding-top:env(safe-area-inset-top);      /* unter der Statusleiste durch */
  background-color:var(--chrome-a);
  background-image:linear-gradient(90deg,var(--chrome-a),var(--chrome-b));
  border-bottom:var(--outline) solid var(--ink-dunkel);
}
.appbar .logo{color:var(--ink-dunkel);text-transform:uppercase;letter-spacing:.08em;
  text-shadow:1.5px 1.5px 0 #FFF8F3}
.appbar .btn{background:#FFF8F3;color:var(--ink-dunkel)}
.appbar .wrap{gap:8px}
#btn-handbuch{white-space:nowrap;padding-inline:12px}
/* Auf schmalen Geräten teilen sich Wortmarke und zwei Knöpfe eine Zeile –
   die Wortmarke gibt nach, damit nichts umbricht oder seitlich scrollt. */
@media (max-width:440px){
  .appbar .wrap{gap:6px}
  .logo{font-size:.88rem;letter-spacing:.02em}
  .logo .dot{width:22px;height:22px}
  #btn-handbuch{padding-inline:8px;font-size:.82rem;gap:6px}
  #btn-settings{padding-inline:10px}
}
.logo .kurz{display:none}
@media (max-width:380px){          /* sehr schmal: nur noch der Markenkern */
  .logo .lang{display:none}
  .logo .kurz{display:inline}
  .logo{font-size:.84rem}
  #btn-handbuch{font-size:.78rem;padding-inline:7px}
}
.appbar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem}
.logo .dot{width:26px;height:26px;border-radius:50%;background:var(--sakura);
  border:var(--outline) solid var(--tinte);display:grid;place-items:center;flex:none}
@media (prefers-color-scheme: dark){.logo .dot{border-color:var(--text)}}

/* =========================================================================
   4. KARTEN, BUTTONS, FORMULARE  ·  Sticker-Optik
   ========================================================================= */
/* Karte = Fenster. Mit data-titel bekommt sie eine Titelleiste im
   Betriebssystem-Look; ohne bleibt sie ein schlichtes Fenster. */
.card{
  position:relative;
  background:var(--surface);
  border:var(--outline) solid var(--ink-dunkel);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--hart);
}
@media (prefers-color-scheme: dark){.card{border-color:#120C1F}}
.card[data-titel]{padding-top:0}
.card[data-titel]::before{
  content:attr(data-titel);
  display:block;margin:0 -16px 14px;padding:7px 64px 7px 12px;
  background-color:var(--chrome-a);
  background-image:linear-gradient(90deg,var(--chrome-a),var(--chrome-b));
  border-bottom:var(--outline) solid var(--ink-dunkel);
  border-radius:8px 8px 0 0;
  font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-dunkel);
}
.card[data-titel]::after{               /* die drei Fensterknöpfe */
  content:"";position:absolute;top:8px;right:12px;width:52px;height:16px;
  background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='52' height='16' viewBox='0 0 52 16'><g fill='%23FFF8F3' stroke='%233B3054' stroke-width='2'><rect x='1' y='1' width='14' height='14' rx='2'/><rect x='19' y='1' width='14' height='14' rx='2'/><rect x='37' y='1' width='14' height='14' rx='2'/></g><g stroke='%233B3054' stroke-width='2' stroke-linecap='round' fill='none'><path d='M5 11h6'/><path d='M23 5h6v6h-6z'/><path d='M41 5l6 6M47 5l-6 6'/></g></svg>") no-repeat center/contain;
}
.card.soft{border-style:solid;background:var(--surface-2)}
.card h2,.card h3{margin-top:0}

.btn{
  font:inherit;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:10px 18px;
  border-radius:var(--radius-pille);
  border:var(--outline) solid var(--ink-dunkel);
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
  box-shadow:var(--hart-klein), inset 0 2px 0 rgba(255,255,255,.65);
  transition:transform .12s ease, box-shadow .12s ease;
  text-decoration:none;
}
@media (prefers-color-scheme: dark){
  .btn{box-shadow:var(--hart-klein), inset 0 2px 0 rgba(255,255,255,.18)}
}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink-dunkel), inset 0 2px 0 rgba(255,255,255,.4)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--sakura);color:var(--accent-ink)}
.btn.mint{background:var(--mint);color:#20303A}
.btn.himmel{background:var(--himmel);color:#1E3242}
.btn.butter{background:var(--butter);color:#3B3054}
.btn.ghost{box-shadow:none;border-style:dashed;background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.9rem}

label{display:block;font-weight:700;margin-bottom:4px}
input[type=text],input[type=tel],input[type=time],input[type=number],textarea,select{
  font:inherit;width:100%;padding:12px 14px;
  border:2px solid var(--line);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);
}
textarea{min-height:90px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent);height:36px}
.field+.field{margin-top:12px}

.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:999px;
  border:2px solid var(--ink-dunkel);background:var(--surface-2);
  box-shadow:2px 2px 0 var(--ink-dunkel);
  font-size:.82rem;font-weight:700;white-space:nowrap;
}
@media (prefers-color-scheme: dark){.pill{border-color:#120C1F}}
.pill.koerper{background:var(--at-koerper);color:#3B2028}
.pill.geist{background:var(--at-geist);color:#132835}
.pill.mut{background:var(--at-mut);color:#251838}
.pill.verbundenheit{background:var(--at-verbundenheit);color:#3A2E07}

/* =========================================================================
   5. NAVIGATION (unten, Daumenreichweite)
   ========================================================================= */
.tabbar{
  position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom));z-index:28;
  background-color:var(--surface);
  background-image:linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  border-top:var(--outline) solid var(--ink-dunkel);
  box-shadow:0 -3px 0 rgba(255,255,255,.6) inset;
}
.tabbar .wrap{display:flex;gap:3px;padding-block:6px}
.tab{
  flex:1 1 0;min-width:0;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font:inherit;font-size:.58rem;font-weight:800;letter-spacing:0;text-transform:uppercase;
  background:var(--surface);border:2px solid var(--ink-dunkel);border-radius:6px;
  color:var(--text-muted);
  box-shadow:2px 2px 0 var(--ink-dunkel), inset 0 2px 0 rgba(255,255,255,.6);
  padding:6px 2px;cursor:pointer;
}
.tab .ic{width:21px;height:21px;display:block}
.tab[aria-current="page"]{
  color:var(--ink-dunkel);background:var(--butter);
  transform:translate(2px,2px);
  box-shadow:0 0 0 var(--ink-dunkel), inset 2px 2px 0 rgba(59,48,84,.22);
}

/* =========================================================================
   6. KRISENLEISTE  ·  auf jedem Screen erreichbar
   ========================================================================= */
.crisisbar{
  position:fixed;left:0;right:0;bottom:0;z-index:29;
  background-color:#3B3054;
  background-image:linear-gradient(180deg,#4A3C6B,#3B3054);color:#FFF8F3;
  border-top:var(--outline) solid var(--ink-dunkel);
  font-size:.86rem;
}
@media (prefers-color-scheme: dark){.crisisbar{background:#160F26}}
.crisisbar .wrap{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:nowrap;
  padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.crisisbar .btn{white-space:nowrap}
.crisisbar a,.crisisbar button{color:#FFF8F3}
.crisisbar .btn{min-height:32px;padding:2px 12px;font-size:.82rem;
  background:transparent;border-color:#FFF8F3;box-shadow:none}

/* =========================================================================
   7. PANIK-BUTTON  ·  immer sichtbar, oberhalb der Navigation
   ========================================================================= */
.panic{
  position:fixed;right:14px;bottom:calc(136px + env(safe-area-inset-bottom));z-index:35;
  width:74px;height:74px;border-radius:50%;
  border:var(--outline) solid var(--ink-dunkel);
  background-color:var(--himmel);
  background-image:radial-gradient(circle at 32% 28%, #fff 0 12%, var(--himmel) 55%);
  color:#14293A;
  font:inherit;font-weight:800;font-size:.72rem;line-height:1.1;letter-spacing:.02em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:var(--hart), 0 10px 20px rgba(59,48,84,.25);
  cursor:pointer;
}
.panic:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink-dunkel)}
/* Beim Scrollen durchscheinend, damit er keinen Text verdeckt – anklickbar
   bleibt er die ganze Zeit, und bei Fokus oder Berührung ist er sofort voll da. */
.panic{transition:opacity .25s ease}
.panic.blass{opacity:.45}
.panic.blass:hover,.panic.blass:focus-visible,.panic:active{opacity:1}
.panic svg{width:26px;height:26px}

/* =========================================================================
   8. AVATAR-BÜHNE, XP, SERIE
   ========================================================================= */
.stage{
  position:relative;display:grid;place-items:center;
  padding:10px 0 4px;
}
.stage .avatar{width:min(240px,62vw);height:auto}
.idle{animation:idle 3.2s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-7px) rotate(-1deg)}}
.tremble{animation:tremble .35s linear infinite}
@keyframes tremble{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.2px,.6px)}75%{transform:translate(1.2px,-.6px)}}
.float-slow{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.spin-slow{animation:spin 14s linear infinite;transform-origin:100px 110px}
@keyframes spin{to{transform:rotate(360deg)}}

.levelname{font-weight:800;font-size:1.15rem;text-align:center}
/* Ladebalken im Y2K-Look: einzelne Blöcke statt glattem Verlauf */
.xpbar{
  height:24px;border-radius:5px;border:var(--outline) solid var(--ink-dunkel);
  background:var(--surface);overflow:hidden;position:relative;padding:3px;
  box-shadow:inset 2px 2px 0 rgba(59,48,84,.14);
}
.xpbar>i{
  display:block;height:100%;border-radius:2px;
  background:
    repeating-linear-gradient(90deg,
      var(--sakura) 0 9px, transparent 9px 12px),
    linear-gradient(90deg,var(--sakura),var(--koralle));
  background-clip:padding-box;
  transition:width .6s cubic-bezier(.2,.9,.3,1);
}

.streak{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.shield{width:26px;height:26px}
.shield.used{opacity:.28}

/* =========================================================================
   9. QUEST-KARTEN
   ========================================================================= */
.quest{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:var(--outline) solid var(--ink-dunkel);
  border-radius:var(--radius);padding:14px;box-shadow:var(--hart);
  font:inherit;color:var(--text);cursor:pointer;
}
.quest:hover{background:var(--surface-2)}
.quest:active{transform:translateY(2px)}
.quest .ic{width:44px;height:44px;flex:none;border-radius:8px;display:grid;place-items:center;
  border:2px solid var(--ink-dunkel);background:var(--surface-2);
  box-shadow:2px 2px 0 var(--ink-dunkel)}
.quest .ic svg{width:26px;height:26px}
.quest h3{margin:0 0 2px;font-size:1rem}
.quest .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quest.done{background:var(--surface-2)}
.quest.done h3::after{content:" ✓";color:#127a5a;font-weight:900}
@media (prefers-color-scheme: dark){.quest.done h3::after{color:#7CF5D2}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.07,.93)}70%{transform:scale(.97,1.04)}100%{transform:scale(1)}}

.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:10px 0 10px 44px;border-bottom:2px dashed var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:8px;
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--butter);color:#3B3054;border:2px solid var(--tinte);font-weight:800;font-size:.9rem;
}
@media (prefers-color-scheme: dark){.steps li::before{border-color:var(--line)}}

.why{background:var(--surface-2);border:2px dashed var(--line);border-radius:var(--radius-sm);padding:12px}
.warnbox{background:var(--butter);color:#3B3054;border:2px solid var(--tinte);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:.92rem}
@media (prefers-color-scheme: dark){.warnbox{background:#5A4A18;color:#FFF3CE;border-color:#7A6828}}

/* =========================================================================
   10. ATEM-ANIMATION
   ========================================================================= */
.breath-stage{display:grid;place-items:center;padding:14px 0;min-height:260px}
.breath{
  width:210px;height:210px;border-radius:50%;
  border:var(--outline) solid var(--tinte);
  background:radial-gradient(circle at 35% 30%, #fff9, transparent 60%), var(--himmel);
  display:grid;place-items:center;
  transform:scale(.62);
  transition:transform linear;
  color:#16313F;font-weight:800;text-align:center;padding:16px;
}
@media (prefers-color-scheme: dark){.breath{border-color:var(--line);color:#10222E}}
.breath .phase{font-size:1.1rem}
.breath .count{font-size:2rem;display:block}

/* =========================================================================
   11. RUHE-INSEL (Notfallmodus) · bewusst anderer Raum
   ========================================================================= */
.island{
  position:fixed;inset:0;z-index:60;
  background:#20304A;color:#EAF1F8;

}

.toast{

  box-shadow:var(--shadow);max-width:92vw;text-align:center;

}

.banner{
  background:var(--butter);color:#3B3054;border:2px solid var(--tinte);

    "Sammle jetzt mindestens drei harmlose Erklärungen: Koffein, wenig Schlaf, Anspannung, Aufstehen, Hitze, Sport, Hunger.",
    "Verteile die Prozente neu – ehrlich, nicht beschönigend.",
    "Schau dir das Diagramm an und lass es einen Moment wirken."],
  warumEsWirkt:"Bei Panik schnappt die Erklärung sofort auf die bedrohlichste Möglichkeit. Die Umverteilung – in der Therapie Reattribution genannt – zwingt dazu, die Konkurrenz aufzulisten, die es immer gibt. Wer erst zehn harmlose Gründe für Herzrasen aufgeschrieben hat, greift beim nächsten Mal seltener zum schlimmsten." },

{ id:"verhaltensexperiment", titel:"Verhaltensexperiment", kategorie:"mut", attribute:{mut:35, geist:15}, dauerMin:25,
  intensitaet:"normal", tool:"experiment",
  anleitung:[
    "Formuliere deine Befürchtung als überprüfbare Vorhersage: „Wenn ich X tue, dann passiert Y.“",
    "Leg fest, woran du erkennen würdest, dass Y eingetreten ist – vorher, nicht hinterher.",
    "Schätze, wie wahrscheinlich Y ist (0–100 %).",
    "Führ das Experiment durch, ohne Sicherheitsverhalten.",
    "Vergleiche: Was hast du vorhergesagt, was ist tatsächlich passiert?",
    "Zieh eine Schlussfolgerung in einem Satz."],
  warumEsWirkt:"Das Verhaltensexperiment ist das wirksamste einzelne Werkzeug der Verhaltenstherapie. Argumente ändern Überzeugungen kaum – Erfahrungen schon. Entscheidend ist, dass die Vorhersage vorher schriftlich feststeht: Sonst erinnert das Gedächtnis sie hinterher passend zum Ausgang.",
  sicherheitshinweis:"Nur Experimente, die an sich ungefährlich sind. Es geht darum, eine Vorhersage zu prüfen – nicht darum, sich etwas zu beweisen." },

{ id:"aufmerksamkeitstraining", titel:"Aufmerksamkeit nach außen", kategorie:"kognitiv", attribute:{geist:22}, dauerMin:8,
  intensitaet:"sanft", tool:"timer",
  anleitung:[
    "Setz dich irgendwohin, wo etwas los ist – Fenster, Café, Park.",
    "Nimm dir zwei Minuten nur für Geräusche: zähle, wie viele verschiedene du unterscheiden kannst.",
    "Zwei Minuten nur für Details, die du siehst – Farben, Bewegungen, Formen.",
    "Zwei Minuten für beides gleichzeitig.",
    "Wenn die Aufmerksamkeit zum Körper zurückspringt: bemerken und wieder nach außen lenken."],
  warumEsWirkt:"Bei Angststörungen wandert die Aufmerksamkeit dauerhaft nach innen, auf den eigenen Körper. Dadurch bemerkt man mehr Empfindungen – nicht weil mehr passiert, sondern weil man hinschaut. Aufmerksamkeitstraining ist das gezielte Gegenteil und lässt sich üben wie ein Muskel." },

{ id:"erwartungsangst", titel:"Die Angst vor der Angst prüfen", kategorie:"kognitiv", attribute:{geist:24}, dauerMin:10,
  intensitaet:"normal", tool:"experiment",
  anleitung:[
    "Nimm dir etwas vor, vor dem dir schon jetzt graut.",
    "Schreib auf, wie schlimm es wird – als Zahl von 0 bis 10.",
    "Schreib dazu, was genau du erwartest: Attacke? Blamage? Weglaufen müssen?",
    "Mach es.",
    "Trag danach ein, wie schlimm es tatsächlich war, und vergleiche die Zahlen."],
  warumEsWirkt:"Erwartungsangst hält Panikstörungen oft stärker aufrecht als die Attacken selbst. Die Vorhersage fällt fast immer schlimmer aus als die Wirklichkeit – aber das merkt man nur, wenn beides nebeneinander steht. Nach einigen Durchgängen wird die Vorhersage von selbst realistischer." },

{ id:"notfallkarte", titel:"Notfallkarte schreiben", kategorie:"kognitiv", attribute:{geist:25, mut:10}, dauerMin:12,
  intensitaet:"sanft", tool:"notfallkarte",
  anleitung:[
    "Schreib in einem Satz auf, was gerade passiert, wenn die Angst hochkommt – in deinen Worten.",
    "Schreib drei Dinge auf, die dir zuverlässig helfen. Konkret, nicht allgemein.",
    "Schreib auf, wen du anrufen kannst.",
    "Formuliere einen Satz, der dich erreicht, wenn wenig anderes durchkommt.",
    "Speichern – die Karte erscheint ab dann sofort in der Ruhe-Insel."],
  warumEsWirkt:"Im Angsthoch funktioniert komplexes Denken kaum noch; abrufbar ist nur, was vorbereitet ist. Genau dafür gibt es in der Therapie die Notfallkarte. Sie wird im ruhigen Zustand geschrieben – von der Person, die dich am besten kennt." },

{ id:"fruehwarnzeichen", titel:"Frühwarnzeichen und Rückfallplan", kategorie:"kognitiv", attribute:{geist:26}, dauerMin:15,
  intensitaet:"normal", tool:"fruehwarn",
  anleitung:[
    "Denk an die Wochen zurück, bevor es das letzte Mal schlechter wurde.",
    "Woran hättest du es früher merken können? Schlaf, Rückzug, mehr Kontrollieren, Termine absagen?",
    "Schreib drei Frühwarnzeichen auf.",
    "Leg zu jedem fest, was du dann konkret tust – klein und sofort machbar.",
    "Halte fest, ab wann du dir Unterstützung holst."],
  warumEsWirkt:"Rückfallprophylaxe ist fester Bestandteil jeder Verhaltenstherapie und wird trotzdem am häufigsten weggelassen. Der Punkt ist nicht, Rückschläge zu verhindern – die gehören dazu –, sondern sie früh zu erkennen, solange gegensteuern noch leicht ist." },

{ id:"vermeidungs-check", titel:"Wochen-Check: Was habe ich gemieden?", kategorie:"mut", attribute:{mut:25, geist:10}, dauerMin:10,
  intensitaet:"sanft", tool:"timer",
  anleitung:[
    "Geh die letzte Woche im Kopf durch, Tag für Tag.",
    "Wo hast du etwas nicht gemacht, abgesagt oder anders gelöst, weil Angst im Spiel war?",
    "Zähl auch die kleinen Sachen: Treppe statt Aufzug, Nachricht statt Anruf, später statt jetzt.",
    "Such dir eine einzige Sache davon aus, die du in der kommenden Woche anders machst.",
    "Trag sie in deine Landkarte der Vermeidung ein."],
  warumEsWirkt:"Vermeidung wächst leise. Sie besteht selten aus großen Entscheidungen, sondern aus vielen kleinen Umwegen, die man nach ein paar Wochen nicht mehr bemerkt. Ein fester Wochen-Check macht sie wieder sichtbar, bevor der Radius unbemerkt kleiner wird." },

{ id:"goldene-regeln", titel:"Die zehn goldenen Regeln lesen", kategorie:"kognitiv", attribute:{geist:20}, dauerMin:8,
  intensitaet:"sanft", tool:"regeln-gold",
  anleitung:[
    "Lies die zehn Regeln einmal ganz durch – laut, wenn du kannst.",
    "Sie stehen in der Ich-Form: Es ist dein Selbstgespräch, nicht ein Ratschlag von außen.",
    "Such dir die eine heraus, die heute am meisten für dich gilt.",
    "Sprich sie dreimal aus und merk sie dir für den Tag.",
    "An ruhigen Tagen lesen heißt: im Ernstfall abrufbar haben."],
  warumEsWirkt:"Diese Regeln fassen zusammen, worauf es bei Angst ankommt: nicht bekämpfen, nicht weglaufen, in der Gegenwart bleiben, abwarten. Im Angsthoch ist kaum noch komplexes Denken möglich – vorformulierte Sätze in der eigenen Stimme sind dann das, was noch funktioniert. Deshalb liest man sie, wenn es einem gut geht." },

{ id:"rueckschlag-regeln", titel:"Wenn es wieder schlechter wird", kategorie:"mut", attribute:{mut:22, geist:18}, dauerMin:12,
  intensitaet:"sanft", tool:"regeln-rueckschlag",
  anleitung:[
    "Lies die zehn Punkte zum Umgang mit Rückschlägen durch.",
    "Markiere ehrlich, wo du gerade stehst: Vermeidest du wieder etwas?",
    "Nimm Punkt 10 ernst – welchen kleineren Schritt kannst du als Nächstes machen?",
    "Trag diesen Schritt in deine Landkarte der Vermeidung ein.",
    "Mach ihn innerhalb der nächsten drei Tage."],
  warumEsWirkt:"Ein Rückschlag ist kein Rückfall in den Anfang – er ist der Moment, in dem sich entscheidet, ob Vermeidung wieder wächst. Wer vorher weiß, was dann zu tun ist, verliert Tage statt Wochen. Der wichtigste Satz darin: Wenn du abgebrochen hast, such die Situation so schnell wie möglich erneut auf.",
  sicherheitshinweis:"„So schnell wie möglich wieder hin“ heißt nicht „sofort und in derselben Größe“. Kleiner wieder anfangen ist der Regelfall, nicht die Ausnahme." },

/* ===== GEIST · Achtsamkeit & Akzeptanz (ACT / MBSR) ==================== */
{ id:"koerperreise", titel:"Körperreise", kategorie:"achtsamkeit", attribute:{geist:25, koerper:10}, dauerMin:10,
  intensitaet:"normal", tool:"bodyscan",
  anleitung:[
    "Leg dich hin, Arme neben dem Körper, Augen zu oder halb geschlossen.",
    "Wandere mit der Aufmerksamkeit langsam durch den Körper – von den Füßen bis zum Scheitel.",
    "Nimm wahr, was da ist: Wärme, Druck, Kribbeln, nichts. Alles ist eine gültige Antwort.",
    "Wenn du abschweifst, kehre freundlich zur letzten Stelle zurück.",
    "Am Ende den ganzen Körper auf einmal spüren."],
  warumEsWirkt:"Der Body-Scan aus dem MBSR-Programm nach Kabat-Zinn trainiert, Körperempfindungen wahrzunehmen, ohne sie sofort zu bewerten. Genau diese Bewertung („da stimmt was nicht“) ist bei Panik der Zündfunke. Beobachten statt deuten lässt sich üben – und wird mit der Zeit zur Gewohnheit.",
  sicherheitshinweis:"Wenn das Hineinspüren in den Körper dich gerade sehr beunruhigt, wähle stattdessen eine Übung mit äußerem Fokus, etwa 5-4-3-2-1." },

{ id:"anker-meditation", titel:"Anker-Meditation", kategorie:"achtsamkeit", attribute:{geist:22}, dauerMin:10,
  intensitaet:"normal", tool:"timer",
  anleitung:[
    "Setz dich aufrecht und bequem hin.",
    "Finde die Stelle, an der du den Atem am deutlichsten spürst – Nase, Brust oder Bauch.",
    "Lass den Atem, wie er ist. Du beobachtest ihn nur.",
    "Wenn du abschweifst: bemerken, benennen („Denken“), zurückkehren.",
    "Zehn Minuten, mit einem sanften Ton am Ende."],
  warumEsWirkt:"Nicht das Nicht-Abschweifen ist die Übung, sondern das Zurückkommen – jedes Mal ist eine Wiederholung. Über Wochen wächst die Fähigkeit, Aufmerksamkeit bewusst zu lenken statt von Gedanken mitgerissen zu werden." },

{ id:"grounding-54321", titel:"5-4-3-2-1", kategorie:"achtsamkeit", attribute:{geist:15}, dauerMin:4,
  intensitaet:"sanft", tool:"grounding",
  anleitung:[
    "Benenne fünf Dinge, die du sehen kannst.",
    "Vier Dinge, die du hören kannst.",
    "Drei Dinge, die du fühlen kannst.",
    "Zwei Dinge, die du riechen kannst.",
    "Eine Sache, die du schmecken kannst – oder eine, die dir heute gefallen hat."],
  warumEsWirkt:"Grounding holt die Aufmerksamkeit aus dem Kopf zurück in die Umgebung. Die Sinne arbeiten nur in der Gegenwart, Angst dagegen fast immer in der Zukunft. Das Benennen macht es dabei wirksamer als bloßes Schauen." },

{ id:"blaetter-fluss", titel:"Gedanken auf Blättern", kategorie:"achtsamkeit", attribute:{geist:20}, dauerMin:7,
  intensitaet:"sanft", tool:"blaetter",
  anleitung:[
    "Stell dir einen langsam fließenden Bach vor, auf dem Blätter treiben.",
    "Leg jeden auftauchenden Gedanken auf ein Blatt.",
    "Schau zu, wie das Blatt vorbeizieht. Du musst es nicht wegschieben und nicht festhalten.",
    "Wenn du merkst, dass du mit dem Bach mitgeschwommen bist: zurück ans Ufer, weiter geht's."],
  warumEsWirkt:"Eine Defusionsübung aus der Akzeptanz- und Commitment-Therapie nach Hayes. Ziel ist nicht, weniger Gedanken zu haben, sondern weniger mit ihnen verschmolzen zu sein. Ein Gedanke, den man vorbeiziehen sieht, verliert seine Macht, ohne dass man ihn widerlegen muss." },

{ id:"ich-habe-den-gedanken", titel:"„Ich habe den Gedanken, dass …“", kategorie:"achtsamkeit", attribute:{geist:16}, dauerMin:4,
  intensitaet:"sanft", tool:"timer",
  anleitung:[
    "Nimm den Angstgedanken, der dich heute am meisten beschäftigt.",
    "Sprich ihn einmal so aus, wie er im Kopf klingt.",
    "Dann dreimal mit der Vorsilbe: „Ich habe den Gedanken, dass …“",
    "Und einmal: „Ich bemerke, dass ich den Gedanken habe, dass …“",
    "Spür nach, ob sich der Abstand verändert hat."],
  warumEsWirkt:"Die Vorsilbe schiebt einen kleinen Spalt zwischen dich und den Satz. Aus „Ich falle gleich um“ wird etwas, das dein Kopf gerade produziert – eine Aussage, die man betrachten kann, statt eine Tatsache, in der man steckt." },

{ id:"werte-kompass", titel:"Werte-Kompass", kategorie:"achtsamkeit", attribute:{geist:15, verbundenheit:15}, dauerMin:8,
  intensitaet:"sanft", tool:"werte",
  anleitung:[
    "Wähle einen Wert, der dir wirklich wichtig ist – nicht den, der sich gehört.",
    "Überlege eine kleine Handlung, die heute zu diesem Wert passt.",
    "Tu sie – auch wenn Unbehagen dabei ist.",
    "Halte in einem Satz fest, wie es war."],
  warumEsWirkt:"In der ACT ist nicht Angstfreiheit das Ziel, sondern ein Leben, das in die eigene Richtung geht. Werte geben die Richtung vor, wenn das Gefühl gerade keine gute Auskunft gibt. Handeln nach Werten baut nebenbei genau die Erfahrungen auf, die Vermeidung verhindert." },

{ id:"musik-achtsam", titel:"Achtsames Musikhören", kategorie:"achtsamkeit", attribute:{geist:14, verbundenheit:8}, dauerMin:5,
  intensitaet:"sanft", tool:"playlist",
  anleitung:[
    "Wähle ein Lied aus deiner Ruhe- oder Kraft-Playlist.",
    "Hör es vollständig – ohne Handy, ohne Nebenbeschäftigung.",
    "Versuch, einzelne Instrumente herauszuhören.",
    "Pflege danach deine Playlists weiter, damit sie im Ernstfall bereit sind."],
  warumEsWirkt:"Ein Lied ganz zu hören ist Achtsamkeitstraining mit eingebautem Timer. Musik verändert dazu messbar Herzfrequenz und Anspannung – und vorbereitete Playlists sind genau dann verfügbar, wenn die Suche nach etwas Passendem zu anstrengend wäre." },

{ id:"achtsam-essen", titel:"Eine Mahlzeit langsam", kategorie:"achtsamkeit", attribute:{geist:14, koerper:6}, dauerMin:10,
  intensitaet:"sanft", tool:"timer",
  anleitung:[
    "Setz dich zum Essen hin, ohne Bildschirm.",
    "Schau dir den ersten Bissen kurz an, bevor du ihn isst.",
    "Kaue langsam und leg das Besteck zwischendurch ab.",
    "Nimm mindestens drei Bissen ganz bewusst wahr – der Rest darf normal sein."],
  warumEsWirkt:"Achtsamkeit braucht keinen Meditationsplatz; sie lässt sich in Handlungen einbauen, die ohnehin täglich stattfinden. Das macht sie alltagstauglich – und langsames Essen beruhigt nebenbei einen angespannten Magen." },

{ id:"selbstmitgefuehl", titel:"Kurze Pause für dich", kategorie:"achtsamkeit", attribute:{geist:15, verbundenheit:8}, dauerMin:5,
  intensitaet:"sanft", tool:"timer",
  anleitung:[
    "Leg eine Hand auf die Brust oder den Bauch.",
    "Sag dir: „Das ist gerade schwer.“ – ohne es kleiner zu machen.",
    "Dann: „Schwierige Momente gehören zum Menschsein. Ich bin damit nicht allein.“",
    "Zuletzt: „Was brauche ich jetzt?“ – und gib dir davon, was möglich ist."],
  warumEsWirkt:"Selbstkritik hält den Alarm oben, Selbstmitgefühl senkt ihn. Die drei Schritte entsprechen der Selbstmitgefühlspause nach Neff: wahrnehmen, einordnen, freundlich reagieren. Das ist kein Sich-gehen-Lassen – es ist die Haltung, aus der heraus Üben überhaupt durchhaltbar ist." },

{ id:"bereitwilligkeit", titel:"Platz machen", kategorie:"achtsamkeit", attribute:{geist:18, mut:10}, dauerMin:7,
  intensitaet:"normal", tool:"timer",
  anleitung:[
    "Finde die Stelle im Körper, an der das unangenehme Gefühl am deutlichsten sitzt.",
    "Beschreibe es wie ein Objekt: Größe, Form, Temperatur, Bewegung.",
    "Atme in die Umgebung dieser Stelle und mach ringsum ein bisschen Platz.",
    "Probier den Satz: „Du darfst hier sein. Ich mache trotzdem weiter.“",
    "Beobachte, ob sich die Form verändert – ohne es zu verlangen."],
  warumEsWirkt:"Der Kampf gegen ein Gefühl macht es größer, weil er den Alarm bestätigt. Bereitwilligkeit ist die Gegenbewegung: das Gefühl da sein lassen und die Aufmerksamkeit trotzdem woanders hin richten können. Weniger Anspannung ist dabei ein Nebeneffekt, nicht das Ziel." },

/* ===== MUT · Verhalten & Exposition in vivo, in kleinen Dosen ==========
   Nur Exposition im Alltag (in vivo). Keine absichtliche Provokation von
   Körpersymptomen – siehe Kommentar oben am Katalog.                      */
{ id:"landkarte-vermeidung", titel:"Landkarte der Vermeidung", kategorie:"mut", attribute:{mut:40, geist:15}, dauerMin:15,
  intensitaet:"normal", tool:"vermeidung", einmalig:true,
  anleitung:[
    "Sammle Situationen, die du meidest oder nur mit Absicherung machst.",
    "Sei konkret: nicht „Menschen“, sondern „allein mit dem Bus zur Arbeit“.",
    "Gib jeder Situation einen Wert von 0 bis 100 – wie viel Angst löst allein die Vorstellung aus?",
    "Speichere; die App sortiert daraus deine Leiter.",
    "Du kannst jederzeit Sprossen ergänzen oder Werte anpassen."],
  warumEsWirkt:"Vermeidung ist der Motor, der Angststörungen am Laufen hält: Jedes Ausweichen bestätigt, dass die Situation gefährlich war. Eine geordnete Leiter macht aus einem diffusen „Ich kann das nicht“ eine Reihe einzelner, unterschiedlich schwerer Schritte – und gibt dir die Reihenfolge selbst in die Hand." },

{ id:"eine-sprosse", titel:"Eine Sprosse höher", kategorie:"mut", attribute:{mut:55, koerper:5}, dauerMin:30,
  intensitaet:"normal", tool:"sprosse",
  anleitung:[
    "Nimm die niedrigste Sprosse deiner Leiter, die du noch nicht gemacht hast.",
    "Plane vorher: Wo, wann, wie lange – und ohne welches Sicherheitsverhalten.",
    "Notiere deine Angst vorher (0–10).",
    "Bleib in der Situation, bis die Angst spürbar nachlässt oder mindestens die geplante Zeit vorbei ist. Nicht im Angst-Hoch gehen.",
    "Notiere den Höhepunkt und den Wert am Ende.",
    "Wiederhole dieselbe Sprosse mehrfach, bevor du höher gehst."],
  warumEsWirkt:"Angst steigt in einer Situation an, erreicht einen Gipfel und fällt dann von allein – wenn man lange genug bleibt. Genau diese Erfahrung ist der Wirkstoff. Verlässt man die Situation im Hoch, lernt das Gehirn stattdessen: Nur die Flucht hat mich gerettet.",
  sicherheitshinweis:"Wähle Schritte, die realistisch machbar sind, und nichts, was tatsächlich gefährlich ist. Wenn eine Stufe dich überfordert, ist die Stufe zu groß – nicht du zu schwach." },

{ id:"sicherheitsnetz-lockern", titel:"Sicherheitsnetz lockern", kategorie:"mut", attribute:{mut:45, geist:10}, dauerMin:20,
  intensitaet:"normal", tool:"exporeview",
  anleitung:[
    "Wähle eine Absicherung, die nur ein Gefühl von Sicherheit erzeugt: die Wasserflasche, die Tablette in der Tasche, der Platz am Gang, die Begleitperson, das ständige Pulsmessen.",
    "Lass sie für einen geplanten Zeitraum weg – eine Sache pro Woche reicht.",
    "Geh in eine Situation, die du sonst damit absicherst.",
    "Schreib danach auf: Was hast du befürchtet? Was ist tatsächlich passiert?"],
  warumEsWirkt:"Sicherheitsverhalten verhindert die entscheidende Erfahrung, dass es auch ohne gutgeht. Solange der Talisman dabei ist, bleibt die Erklärung „gerade nochmal gut gegangen“ – und die Angst behält recht." },

{ id:"rueckblick-mutprobe", titel:"Rückblick nach der Mutprobe", kategorie:"mut", attribute:{mut:25, geist:20}, dauerMin:8,
  intensitaet:"sanft", tool:"exporeview",
  anleitung:[
    "Was genau hatte ich befürchtet? Möglichst wörtlich.",
    "Was ist tatsächlich passiert?",
    "Wie hoch war die Angst im höchsten Moment – und wie lange hielt sie dort?",
    "Was sagt mir das über meine ursprüngliche Befürchtung?",
    "Was nehme ich für den nächsten Schritt mit?"],
  warumEsWirkt:"Der Rückblick ist der eigentliche Wirkfaktor, nicht das Aushalten allein. Erst beim Vergleich von Befürchtung und Realität entsteht die neue Erfahrung, die das alte Muster überschreibt. Ohne diesen Schritt bleibt von einer Exposition oft nur die Erinnerung an die Anstrengung." },

{ id:"mikro-mut", titel:"Mikro-Mut", kategorie:"mut", attribute:{mut:30}, dauerMin:10,
  intensitaet:"sanft", tool:"timer",
  anleitung:[
    "Such dir eine Kleinigkeit, die dich ein bisschen kostet – in einem Laden etwas fragen, jemanden grüßen, eine Mail abschicken.",
    "Setz dir eine Zeit dafür: heute, in der nächsten Stunde.",
    "Mach es, bevor du dich bereit fühlst.",
    "Danach in einem Satz festhalten, wie es war."],
  warumEsWirkt:"Mut ist keine Stimmung, sondern eine Handlung, die dem Gefühl vorausgeht. Kleine Schritte zählen dabei voll – sie trainieren dieselbe Bewegung wie große, nur in einer Dosis, die man auch an schlechten Tagen schafft." },

{ id:"allein-gehen", titel:"Ein Stück allein", kategorie:"mut", attribute:{mut:40}, dauerMin:25,
  intensitaet:"normal", tool:"sprosse",
  anleitung:[
    "Wähle einen Weg, den du sonst nur in Begleitung gehst – und mach ein kurzes Stück davon allein.",
    "Plan vorher, wie weit genau. Lieber zu kurz als gar nicht.",
    "Geh das geplante Stück zu Ende, auch wenn Unruhe aufkommt.",
    "Notiere Angst vorher, auf dem Höhepunkt und danach."],
  warumEsWirkt:"Begleitung ist eine der häufigsten Formen von Sicherheitsverhalten. Sie zu reduzieren – in planbaren Portionen – zeigt dir, dass die Situation und nicht die Begleitperson das Entscheidende war.",
  sicherheitshinweis:"Nur Wege wählen, die an sich sicher sind. Nicht im Straßenverkehr üben, der volle Aufmerksamkeit verlangt." },

{ id:"unsicherheit-aushalten", titel:"Nicht nachschauen", kategorie:"mut", attribute:{mut:35, geist:10}, dauerMin:15,
  intensitaet:"normal", tool:"timer",
  anleitung:[
    "Wähle eine Rückversicherung, die du oft machst: Symptome googeln, Puls messen, nachfragen „Ist das normal?“, Körperstellen abtasten.",
    "Nimm dir vor, sie heute für einen festen Zeitraum nicht zu tun – zwei Stunden reichen zum Anfang.",
    "Wenn der Drang kommt: bemerken, Zeit ansehen, weiteratmen, weitermachen.",
    "Halte am Ende fest, wie oft der Drang kam – und wie es ohne ausging."],
  warumEsWirkt:"Rückversicherung beruhigt für Minuten und verstärkt die Angst langfristig, weil sie die Botschaft transportiert: Ohne Prüfen wäre es gefährlich. Der Drang ist eine Welle wie die Angst selbst – er steigt, und er fällt auch wieder." },

/* ===== VERBUNDENHEIT =================================================== */
{ id:"menschen-zeit", titel:"Menschen-Zeit", kategorie:"verbundenheit", attribute:{verbundenheit:30}, dauerMin:30,
  intensitaet:"sanft", tool:"timer",
  anleitung:[
    "Verabrede dich mit jemandem, den du magst – oder nutze eine Gelegenheit, die ohnehin da ist.",
    "Leg das Handy für 30 Minuten weg.",
    "Sei wirklich dabei: zuhören, nachfragen, nicht nebenbei planen.",
    "Es muss kein tiefes Gespräch sein. Gemeinsam Zeit verbringen reicht."],
  warumEsWirkt:"Soziale Bindung ist einer der stärksten Schutzfaktoren für psychische Gesundheit – vergleichbar mit Bewegung und Schlaf. Angst zieht Menschen nach innen und aus Kontakten heraus; diese Quest arbeitet genau dagegen." },

  { id:"wk-sicherheitsverhalten", titel:"Was Sicherheitsverhalten ist",

/* Wie weit ist eine Medaille? Liefert Stand, erreichte Stufe und Ziel. */
function medaillenStand(m, s){
  const wert = Math.max(0, Number(m.wert(s || S)) || 0);
  const stufe = m.stufen.filter(x => wert >= x).length;       // 0 = noch keine
  const naechstesZiel = stufe < 3 ? m.stufen[stufe] : m.stufen[2];
  const vorher = stufe === 0 ? 0 : m.stufen[stufe-1];
  const prozent = stufe >= 3 ? 100
    : clamp(Math.round((wert - vorher) / (naechstesZiel - vorher) * 100), 0, 100);
  return { wert, stufe, naechstesZiel, prozent };
}
const goldMedaillen = () => MEDAILLEN.filter(m => medaillenStand(m).stufe >= 3);

/* Alle Durchgänge – aktueller Gipfel plus Archiv. */
function alleDurchgaenge(s){
  const aktuell = s.gipfel && Array.isArray(s.gipfel.durchgaenge) ? s.gipfel.durchgaenge : [];
  const alt = (s.gipfelArchiv||[]).reduce((a,g) => a.concat(g.durchgaenge||[]), []);
  return aktuell.concat(alt);
}

/* --- Migration ----------------------------------------------------------
   Ergänzt fehlende Felder, damit ältere Speicherstände nicht kaputtgehen.
   Regel: niemals Felder löschen, immer nur auffüllen.                      */
function migrate(state){
  const std = leererState();
  if (!state || typeof state !== "object") return std;

  const out = Object.assign({}, std, state);
  out.version = VERSION;
  out.profile = Object.assign({}, std.profile, state.profile || {});
  out.xp      = Object.assign({}, std.xp, state.xp || {});
  out.streak  = Object.assign({}, std.streak, state.streak || {});
  out.settings= Object.assign({}, std.settings, state.settings || {});
  out.daily   = Object.assign({}, std.daily, state.daily || {});
  out.stats   = Object.assign({}, std.stats, state.stats || {});
  out.playlists = Object.assign({}, std.playlists, state.playlists || {});

  // Arrays absichern
  ["completions","achievements","medals","kursModule","journal","copingCards","avoidanceMap","emergencyContacts","gipfelArchiv"]
    .forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  /* Gipfel absichern: fehlende Teilstrukturen ergänzen, Unfertiges verwerfen */
  if (out.gipfel && typeof out.gipfel === "object"){
    out.gipfel.etappen     = Array.isArray(out.gipfel.etappen) ? out.gipfel.etappen : [];
    out.gipfel.durchgaenge = Array.isArray(out.gipfel.durchgaenge) ? out.gipfel.durchgaenge : [];
    out.gipfel.notfallplan = Object.assign({ kontakt:"", ausstiegssatz:"" }, out.gipfel.notfallplan || {});
    out.gipfel.status      = out.gipfel.status || "aktiv";
    out.gipfel.zielSud     = Number(out.gipfel.zielSud) || 0;
    if (!out.gipfel.titel) out.gipfel = null;
  } else out.gipfel = null;
  ["ruhe","kraft"].forEach(k => { if(!Array.isArray(out.playlists[k])) out.playlists[k]=[]; });
  if (!Array.isArray(out.daily.questIds)) out.daily.questIds = [];
  if (!Array.isArray(out.daily.done)) out.daily.done = [];

  // Zahlen absichern
  ATTR_KEYS.forEach(k => { out.xp[k] = Number(out.xp[k]) || 0; });
  out.totalXp = Number(out.totalXp) || ATTR_KEYS.reduce((a,k)=>a+out.xp[k],0);
  out.level   = Number(out.level) || 1;
  out.streak.current = Number(out.streak.current)||0;
  out.streak.longest = Number(out.streak.longest)||0;
  out.streak.shields = clamp(Number(out.streak.shields)||0, 0, 3);

  // Einträge ohne id nachträglich mit einer versehen
  out.copingCards  = out.copingCards.map(c => c.id ? c : Object.assign({id:neueId()}, c));
  out.avoidanceMap = out.avoidanceMap.map(a => a.id ? a : Object.assign({id:neueId()}, a));
  out.journal      = out.journal.map(j => j.id ? j : Object.assign({id:neueId()}, j));

  if (!ARTEN[out.profile.art]) out.profile.art = "mochi";   // unbekannte Art abfangen
  if (!out.profile.elitePartner) out.profile.elitePartner = ELITE_PARTNER_STANDARD;
  out.notfallkarte = Object.assign({ was:"", hilft:"", wen:"", satz:"" }, out.notfallkarte || {});
  out.fruehwarnplan = Object.assign({ zeichen:["","",""], schritte:["","",""], ab:"" }, out.fruehwarnplan || {});
  if (!Array.isArray(out.fruehwarnplan.zeichen)) out.fruehwarnplan.zeichen = ["","",""];
  if (!Array.isArray(out.fruehwarnplan.schritte)) out.fruehwarnplan.schritte = ["","",""];
  out.level = levelFuer(out.totalXp).stufe;
  return out;
}

function neueId(){
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
}

  try{

}

    STORAGE_OK = false;
    console.warn("Speichern nicht möglich:", e);
  }
}

/* --- Level -------------------------------------------------------------- */
/* Stufe 1 heißt bei jeder Art anders; ab Stufe 2 ist der Bogen gemeinsam. */
const levelName = lvl => lvl.stufe === 1 ? meineArt().stufe1Name : lvl.name;
/* Ersetzt die Platzhalter {figur} und {elite} durch die gewählten Namen. */
const elitePartner = () => (S && S.profile && S.profile.elitePartner) || ELITE_PARTNER_STANDARD;
const mitNamen = text => String(text)
  .replace(/\{figur\}/g, figurName())
  .replace(/\{elite\}/g, elitePartner());

function levelFuer(total){
  let l = LEVELS[0];
  for (const lv of LEVELS) if (total >= lv.ab) l = lv;
  return l;
}
function naechstesLevel(total){
  return LEVELS.find(lv => lv.ab > total) || null;
}
function levelFortschritt(total){
  const akt = levelFuer(total), next = naechstesLevel(total);
  if (!next) return { prozent:100, text:"Höchste Stufe erreicht", rest:0 };
  const spanne = next.ab - akt.ab;
  const drin = total - akt.ab;
  return {
    prozent: clamp(Math.round(drin/spanne*100),0,100),
    rest: next.ab - total,
    text: (next.ab - total) + " Punkte bis " + next.name
  };
}

/* --- Serie: Multiplikator wächst bis 1.5× und ist bei 14 Tagen gedeckelt,
   damit ein Abbruch sich nie wie ein Totalverlust anfühlt.                 */
function serienMultiplikator(){
  return 1 + Math.min(S.streak.current, 14) / 14 * 0.5;
}

/* --- Tageswechsel prüfen ------------------------------------------------
   Wird beim Start aufgerufen. Ruhetag-Schilde fangen ausgelassene Tage ab.
   Es gibt hier keinen Punktabzug und keine negative Formulierung.          */
function tagesUebergang(){
  const info = { schild:0, rueckkehr:false, pause:false };
  const letzter = S.streak.lastActiveDate;
  if (!letzter) return info;
  const abstand = tage(letzter, heute());
  if (abstand <= 1) return info;              // gestern oder heute aktiv
  const verpasst = abstand - 1;

  if (S.streak.shields >= verpasst){
    S.streak.shields -= verpasst;
    // Serie bleibt bestehen: letzter aktiver Tag rückt auf gestern
    const g = new Date(); g.setDate(g.getDate()-1);
    S.streak.lastActiveDate = g.toISOString().slice(0,10);
    info.schild = verpasst;
  } else {
    S.streak.current = 0;
    S.streak.lastActiveDate = null;
    if (verpasst >= 7) { info.rueckkehr = true; S.stats.zeigeRueckkehr = true; }
    else info.pause = true;
  }
  speichern();
  return info;
}

/* --- Serie fortschreiben (bei jeder abgeschlossenen Quest) --------------- */
function serieFortschreiben(){
  const t = heute();
  if (S.streak.lastActiveDate === t) return;
  const g = new Date(); g.setDate(g.getDate()-1);
  const gestern = g.toISOString().slice(0,10);
  S.streak.current = (S.streak.lastActiveDate === gestern) ? S.streak.current + 1 : 1;
  S.streak.lastActiveDate = t;
  S.streak.longest = Math.max(S.streak.longest, S.streak.current);
  // Jede volle Woche gibt ein Ruhetag-Schild dazu (höchstens drei)
  if (S.streak.current > 0 && S.streak.current % 7 === 0 &&
      S.stats.letzterWochenSchild !== S.streak.current){
    S.stats.letzterWochenSchild = S.streak.current;
    if (S.streak.shields < 3){
      S.streak.shields++;
      toast("Ein Ruhetag-Schild dazubekommen 🛡️");
    }
  }
}

/* --- Tagesplan ----------------------------------------------------------
   Drei Quests: eine kleine, eine mittlere und eine Mut-Quest.
   Auswahl ist pro Tag stabil (deterministischer Zufall aus dem Datum).     */
function seedZahl(text){
  let h = 2166136261;
  for (let i=0;i<text.length;i++){ h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
}
const POOL = {
  klein:  () => QUESTS.filter(q => !["mut","mini","elite"].includes(q.kategorie) && q.dauerMin<=10),
  mittel: () => QUESTS.filter(q => !["mut","mini","elite"].includes(q.kategorie) && q.dauerMin>10),
  mut:    () => QUESTS.filter(q => q.kategorie==="mut"),
  mini:   () => QUESTS.filter(q => q.kategorie==="mini"),
  elite:  () => QUESTS.filter(q => q.kategorie==="elite")
};

/* --- Elite-Tage ---------------------------------------------------------
   Garantiert drei Tage pro Woche mit einer Elite-Aktivität im Tagespensum.
   Die Auswahl ist pro Kalenderwoche stabil (deterministisch aus dem Montag
   der Woche), damit sich der Vorschlag nicht bei jedem Öffnen ändert.
   Einer der drei Tage ist immer Freitag oder Samstag – dort passt Ausgehen
   am ehesten in ein normales Leben.                                        */
function wochenSchluessel(datum){
  const d = new Date(datum + "T12:00:00");
  d.setDate(d.getDate() - ((d.getDay()+6) % 7));       // zurück auf Montag
  return d.toISOString().slice(0,10);
}
function eliteTage(datum){
  const seed = seedZahl("elite|" + wochenSchluessel(datum) + "|" + S.createdAt);
  const ausgeh = [4,5][seed % 2];                       // Freitag oder Samstag
  const rest = [0,1,2,3,6].filter(x => x !== ausgeh);
  const a = rest[seed % rest.length];
  const uebrig = rest.filter(x => x !== a);
  const b = uebrig[(seed >> 3) % uebrig.length];
  return new Set([ausgeh, a, b]);
}
const wochentagVon = datum => (new Date(datum + "T12:00:00").getDay() + 6) % 7;
function istEliteTag(datum){
  if (!S.settings.eliteAktiv) return false;
  if (!POOL.elite().length) return false;
  return eliteTage(datum).has(wochentagVon(datum));
}
/* Passende Elite-Quest für den Wochentag: Ausgehen eher am Wochenende. */
function eliteFuerTag(datum, seed){
  const tag = wochentagVon(datum);
  const wunsch = tag >= 4 ? "wochenende" : (tag === 6 ? "egal" : "abend");
  const passend = POOL.elite().filter(q => q.bevorzugt === wunsch || q.bevorzugt === "egal");
  const pool = passend.length ? passend : POOL.elite();
  return pool[seed % pool.length];
}
function tagesplanSicherstellen(){
  const t = heute();
  if (S.daily.date === t && S.daily.questIds.length) return;
  S.daily = { date:t, questIds: planBauen(t, false), sanft:false, done:[] };
  speichern();
}
function planBauen(datum, sanft){
  if (sanft) return POOL.mini().map(q=>q.id).slice(0,3);
  const seed = seedZahl(datum + "|" + S.createdAt);
  /* Grundeinstellung „sanft“: kürzere Übungen bevorzugen, solange welche da sind */
  const dosiert = pool => {
    if (S.profile.intensity !== "sanft") return pool;
    const leicht = pool.filter(q => q.intensitaet === "sanft");
    return leicht.length ? leicht : pool;
  };
  const pick = (pool, versatz) => { const pp = dosiert(pool); return pp[(seed + versatz*7) % pp.length].id; };
  const ids = [ pick(POOL.klein(),0), pick(POOL.mittel(),1), pick(POOL.mut(),2) ];
  // Landkarte nur vorschlagen, solange es noch keine gibt
  if (ids[2]==="landkarte-vermeidung" && S.avoidanceMap.length){
    const alt = POOL.mut().filter(q=>q.id!=="landkarte-vermeidung");
    ids[2] = alt[seed % alt.length].id;
  }
  if (ids[2]==="eine-sprosse" && !S.avoidanceMap.length) ids[2] = "landkarte-vermeidung";
  /* An Elite-Tagen ersetzt die gemeinsame Aktivität einen der beiden
     Alltagsslots – das Tagespensum bleibt bei drei Quests. */
  if (istEliteTag(datum)){
    const e = eliteFuerTag(datum, seed);
    ids[e.dauerMin <= 25 ? 0 : 1] = e.id;
  }
  return ids;
}
/* Eine einzelne Quest gegen eine andere aus derselben Kategorie tauschen */
function questTauschen(index){
  const aktuell = questById(S.daily.questIds[index]);
  if (!aktuell) return;
  const gleiche = QUESTS.filter(q =>
    q.kategorie === aktuell.kategorie && !S.daily.questIds.includes(q.id));
  const pool = gleiche.length ? gleiche
    : QUESTS.filter(q => q.kategorie === aktuell.kategorie);
  const neu = pool[Math.floor(Math.random()*pool.length)];
  S.daily.questIds[index] = neu.id;
  speichern();
  render();
  toast("Getauscht: " + mitNamen(neu.titel));
}
/* Sanfter Tag – jederzeit umlegbar, die Serie bleibt erhalten */
function sanftUmschalten(){
  const an = !S.daily.sanft;
  S.daily.sanft = an;
  S.daily.questIds = planBauen(heute(), an);
  if (an){ S.stats.sanfteTage = (S.stats.sanfteTage||0) + 1; }
  speichern();
  pruefeAchievements();
  render();
  toast(an ? "Sanfter Tag ist an." : "Normales Tagespensum.");
}

/* --- Quest abschließen & Punkte vergeben --------------------------------
   ACHTUNG: Der Notfallmodus ruft diese Funktion bewusst NICHT auf.
   Für eine Panikattacke gibt es keine Punkte – nur das freiwillige
   Reflektieren danach zahlt auf Geist ein.                                 */
function questAbschliessen(quest, extra){
  extra = extra || {};
  if (!S.daily.done.includes(quest.id)) S.daily.done.push(quest.id);
  return punkteGutschreiben(quest.attribute, {
    questId: quest.id,
    durationMin: extra.durationMin != null ? extra.durationMin : quest.dauerMin,
    moodBefore: extra.moodBefore != null ? extra.moodBefore : null,
    moodAfter:  extra.moodAfter  != null ? extra.moodAfter  : null,
    note: extra.note || ""
  });
}

/* Der gemeinsame Kern: Punkte verbuchen, Serie fortschreiben, Level prüfen.
   Wird von Quests UND vom Gipfel benutzt, damit beide gleich abrechnen.
   opts.ohneSerie = true rechnet ohne Serien-Multiplikator (Gipfel-Bonus). */
function punkteGutschreiben(attribute, opts){
  opts = opts || {};
  const mult = opts.ohneSerie ? 1 : serienMultiplikator();
  const gewinn = {};
  let summe = 0;
  for (const k of ATTR_KEYS){
    if (attribute[k]){
      const p = Math.round(attribute[k] * mult);
      gewinn[k] = p; S.xp[k] += p; summe += p;
    }
  }
  S.totalXp += summe;
  if (opts.questId){
    S.completions.push({
      questId: opts.questId, date: heute(),
      durationMin: opts.durationMin != null ? opts.durationMin : 0,
      moodBefore: opts.moodBefore != null ? opts.moodBefore : null,
      moodAfter:  opts.moodAfter  != null ? opts.moodAfter  : null,
      note: opts.note || ""
    });
  }
  /* Sobald echte Arbeit drinsteckt, den Browser um dauerhaften Speicher
     bitten. Nicht beim ersten Start – das wäre eine Nachfrage ohne Anlass. */
  if (S.completions.length === 5 && !S.stats.speicherAngefragt){
    S.stats.speicherAngefragt = true;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }
    catch(e){ /* alter Browser: dann eben nicht */ }
  }
  const altesLevel = S.level;
  serieFortschreiben();
  S.level = levelFuer(S.totalXp).stufe;
  speichern();

  const teile = Object.keys(gewinn).map(k => "+" + gewinn[k] + " " + ATTRIBUTE[k].name);
  melde(teile.join(", ") + ". Gesamtpunkte " + S.totalXp + ".");
  toast("✨ " + teile.join("  ·  "));

  const neue = pruefeAchievements();
  const medaillen = pruefeMedaillen();
  const gold = medaillen.filter(x => x.stufe >= 3);
  /* Reihenfolge der Feiern: Stufenaufstieg, dann Gold, dann Abzeichen. */
  if (S.level > altesLevel) zeigeLevelUp(LEVELS[S.level-1]);
  else if (gold.length) zeigeMedaille(gold[0].m, 3);
  else if (neue.length) zeigeAchievement(neue[0]);
  else if (medaillen.length) zeigeMedaille(medaillen[0].m, medaillen[0].stufe);
  return gewinn;
}

/* --- Medaillen prüfen ----------------------------------------------------
   Liefert die neu erreichten Stufen zurück; Gold wird gefeiert, Bronze und
   Silber melden sich mit einem Hinweis.                                    */
function pruefeMedaillen(){
  const neu = [];
  for (const m of MEDAILLEN){
    const st = medaillenStand(m);
    if (!st.stufe) continue;
    const bekannt = S.medals.find(x => x.id === m.id);
    if (!bekannt){
      S.medals.push({ id:m.id, stufe:st.stufe, unlockedAt:new Date().toISOString() });
      neu.push({ m, stufe:st.stufe });
    } else if (st.stufe > bekannt.stufe){
      bekannt.stufe = st.stufe;
      bekannt.unlockedAt = new Date().toISOString();
      neu.push({ m, stufe:st.stufe });
    }
  }
  if (neu.length) speichern();
  return neu;
}
function zeigeMedaille(m, stufe){
  const st = MEDAILLEN_STUFEN[stufe-1];
  if (stufe >= 3) konfetti();
  overlay(`
    <div class="center">${medailleSvg(m, stufe, 120)}</div>
    <h2 class="center">${esc(st.name)}medaille: ${esc(m.name)}</h2>
    <p class="center">${esc(m.text)}</p>
    ${stufe >= 3
      ? `<p class="center small muted">Gold erscheint ab jetzt neben deinem Avatar.</p>`
      : `<p class="center small muted">Nächste Stufe bei ${medaillenStand(m).naechstesZiel} ${esc(m.einheit)}.</p>`}
    <button class="btn primary block" data-close>Schön</button>`);
  melde(st.name + "medaille erreicht: " + m.name);
}

/* --- Achievements prüfen ------------------------------------------------ */
function pruefeAchievements(ctx){
  const neu = [];
  for (const a of ACHIEVEMENTS){
    if (S.achievements.some(x => x.id === a.id)) continue;
    let ok = false;
    try { ok = !!a.pruef(S, ctx); } catch(e){ ok = false; }
    if (ok){
      S.achievements.push({ id:a.id, unlockedAt:new Date().toISOString() });
      neu.push(a);
    }
  }
  if (neu.length) speichern();
  return neu;
}


/* --- C.7  Mein Gipfel: Punkte und Zustandsübergänge ---------------------- */
/* Punkte für einen Durchgang. Ein Abbruch zahlt 60 % – nie null, weil
   Anfangen der schwere Teil ist und ein Abbruch nie bestraft werden darf. */
function durchgangPunkte(etappe, abgebrochen, mitAuswertung){
  const basis = Math.round(25 + 0.4 * (Number(etappe.sud)||0));
  const mut = abgebrochen ? Math.round(basis * 0.6) : basis;
  const attr = { mut: mut };
  if (mitAuswertung) attr.geist = 15;
  return attr;
}
function gipfelAnlegen(G){
  S.gipfel = {
    id: neueId(), titel: G.titel.trim(), warum: G.warum.trim(), wert: S.profile.wert,
    zielSud: Number(G.zielSud)||0, erstelltAm: heute(), status: "aktiv",
    sicherheitscheck: { bestaetigt:true, aerztlichAbgeklaert: !!G.abgeklaert },
    notfallplan: { kontakt:G.kontakt.trim(), ausstiegssatz:G.ausstiegssatz.trim() },
    verbuendeter: G.verbuendeter.trim(),
    etappen: G.etappen.slice().sort((a,b)=>a.sud-b.sud)
      .map(e => ({ id:e.id, text:e.text, sud:e.sud, geplanteMin:e.geplanteMin,
                   ohneSicherheit:e.ohneSicherheit, status:"offen" })),
    durchgaenge: [], abgeschlossenAm:null, bonus:0
  };
  speichern();
  punkteGutschreiben({ geist:30 }, { questId:"gipfel-plan", label:"Gipfel festgelegt" });
}
function durchgangEintragen(){
  const g = S.gipfel, d = DSTATE;
  const e = etappeVon(d.etappeId);
  if (!g || !e) return;
  const passiert = ($("#dg-passiert") && $("#dg-passiert").value.trim()) || "";
  const erkenntnis = ($("#dg-erkenntnis") && $("#dg-erkenntnis").value.trim()) || "";
  const eintrag = {
    id: neueId(), etappeId: e.id, date: heute(),
    vorhersage: d.vorhersage, wahrscheinlichkeit: d.wahrscheinlichkeit,
    sudVorher: d.sudVorher,
    sudHoch: Number(($("#dg-hoch")||{}).value || 7),
    sudNachher: Number(($("#dg-nach")||{}).value || 4),
    dauerMin: Math.max(1, Math.round((Date.now() - d.start)/60000)),
    abgebrochen: !!d.abgebrochen, wasPassierte: passiert, erkenntnis: erkenntnis
  };
  g.durchgaenge.push(eintrag);
  /* Der Durchgang landet zusätzlich im Journal – dort ist er durchsuchbar. */
  journalEintrag("expo-review", {
    situation: e.text, befuerchtet: d.vorhersage, passiert: passiert,
    hoehepunkt: String(eintrag.sudHoch), bedeutung: erkenntnis,
    naechstes: eintrag.abgebrochen ? "Abgebrochen – Etappe eventuell verkleinern." : ""
  });
  speichern();
  punkteGutschreiben(durchgangPunkte(e, eintrag.abgebrochen, !!(passiert || erkenntnis)),
    { questId:"gipfel-durchgang", durationMin:eintrag.dauerMin,
      moodBefore:eintrag.sudVorher, moodAfter:eintrag.sudNachher, note:erkenntnis });
  DSTATE = null;
  gehe("gipfel");
  if (eintrag.abgebrochen) setTimeout(() => overlay(`
    <h2>Angefangen ist der schwere Teil</h2>
    <p>Du warst in der Situation. Das zählt – die Punkte sind dir gutgeschrieben.</p>
    <p class="small muted">Wenn dieselbe Etappe dich mehrfach überfordert, ist die Etappe zu groß,
       nicht du zu schwach. „Etappe halbieren“ macht daraus zwei kleinere Schritte.</p>
    <button class="btn primary block" data-close>Verstanden</button>`), 700);
}
function etappeAbschliessen(id){
  const e = etappeVon(id); if (!e) return;
  e.status = "geschafft"; speichern();
  punkteGutschreiben({ mut:40 }, { questId:"gipfel-etappe" });
  render();
}
function gipfelAbschliessen(){
  const g = S.gipfel; if (!g) return;
  g.status = "abgeschlossen";
  g.abgeschlossenAm = heute();
  const B = GIPFEL_BONUS(g.zielSud);
  const teile = { mut: Math.round(B*0.7), geist: Math.round(B*0.2), verbundenheit: Math.round(B*0.1) };
  g.bonus = teile.mut + teile.geist + teile.verbundenheit;
  speichern();
  /* Ohne Serien-Multiplikator: der Gipfel soll nicht davon abhängen,
     ob gerade eine Serie läuft. */
  punkteGutschreiben(teile, { questId:"gipfel-abschluss", ohneSerie:true });
  konfetti();
  render();
}
function gipfelArchivieren(){
  if (!S.gipfel) return;
  S.gipfelArchiv = S.gipfelArchiv || [];
  S.gipfelArchiv.push(S.gipfel);
  S.gipfel = null;
  speichern(); render();
  toast("Im Archiv. Platz für den nächsten.");
}

/* --- Journal & Karten --------------------------------------------------- */
function journalEintrag(type, fields){
  S.journal.push({ id:neueId(), date:heute(), type:type, fields:fields });
  speichern();

}

/* ===========================================================================
   §D  AVATAR & GRAFIK  ·  alles als Inline-SVG, keine externen Dateien
   ---------------------------------------------------------------------------
   Eigenständige Figur: „Mochi“ ist ein Originaldesign. Bewusst keine
   Anlehnung an existierende Anime-, Spiel- oder Markenfiguren – nur der
   allgemeine Chibi-/Kawaii-Stil, der frei verwendbar ist.
   Chibi-Proportionen: Kopf etwa halbe Figurhöhe, große Augen mit zwei bis
   drei Glanzlichtern, winzige Gliedmaßen, runde Wangen.
   =========================================================================== */
const SW = 5;  /* gleichmäßige Outline-Stärke */

/* Augen mit Glanzlichtern – wiederverwendbarer Baustein */
function augen(x1,x2,y,r,zu){
  if (zu) return `
    <path d="M${x1-9} ${y} q9 9 18 0" fill="none" stroke="var(--ink)" stroke-width="${SW}" stroke-linecap="round"/>
    <path d="M${x2-9} ${y} q9 9 18 0" fill="none" stroke="var(--ink)" stroke-width="${SW}" stroke-linecap="round"/>`;
  return `
    <ellipse cx="${x1}" cy="${y}" rx="${r*0.86}" ry="${r}" fill="var(--ink)"/>
    <ellipse cx="${x2}" cy="${y}" rx="${r*0.86}" ry="${r}" fill="var(--ink)"/>
    <circle cx="${x1-2.5}" cy="${y-3.5}" r="${r*0.34}" fill="#fff"/>
    <circle cx="${x2-2.5}" cy="${y-3.5}" r="${r*0.34}" fill="#fff"/>
    <circle cx="${x1+3}" cy="${y+3}" r="${r*0.18}" fill="#fff" opacity=".85"/>
    <circle cx="${x2+3}" cy="${y+3}" r="${r*0.18}" fill="#fff" opacity=".85"/>`;
}
const wangen = (x1,x2,y) => `
  <ellipse cx="${x1}" cy="${y}" rx="9" ry="6" fill="var(--koralle)" opacity=".5"/>
  <ellipse cx="${x2}" cy="${y}" rx="9" ry="6" fill="var(--koralle)" opacity=".5"/>`;

/* ---------------------------------------------------------------------------
   Bausteine für die Arten: Ohren, Kiemen, Flügel, Schwänze.
   P = { cx, cy, r } Kopfmitte und -radius, { bx, by } Rumpfmitte.
   s = -1 für links, +1 für rechts.
   ------------------------------------------------------------------------- */
function ohr(P, s, laenge, rund, farbe, innen){
  const { cx, cy, r } = P;
  const p1x = cx + s*0.84*r, p1y = cy - 0.52*r;
  const p2x = cx + s*0.26*r, p2y = cy - 0.96*r;
  const mx = (p1x+p2x)/2, my = (p1y+p2y)/2;
  const ux = (mx-cx)/r, uy = (my-cy)/r;
  const tx = mx + ux*laenge, ty = my + uy*laenge;
  const d = rund
    ? `M${p1x} ${p1y} Q${tx + s*0.26*r} ${ty + 0.12*r} ${tx} ${ty} Q${tx - s*0.34*r} ${ty + 0.18*r} ${p2x} ${p2y} Z`
    : `M${p1x} ${p1y} L${tx} ${ty} L${p2x} ${p2y} Z`;
  const i1x = p1x + (mx-p1x)*0.40, i1y = p1y + (my-p1y)*0.40;
  const i2x = p2x + (mx-p2x)*0.40, i2y = p2y + (my-p2y)*0.40;
  const itx = mx + ux*laenge*0.58, ity = my + uy*laenge*0.58;
  return `<path d="${d}" fill="${farbe}" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>` +
    (innen ? `<path d="M${i1x} ${i1y} L${itx} ${ity} L${i2x} ${i2y} Z" fill="${innen}" opacity=".9"/>` : "");
}
function kieme(P, s, grad, laenge, farbe){
  const { cx, cy, r } = P;
  const w = grad*Math.PI/180;
  const sx = cx + s*Math.cos(w)*r*0.94, sy = cy + Math.sin(w)*r*0.94;
  const ex = cx + s*Math.cos(w)*(r+laenge), ey = cy + Math.sin(w)*(r+laenge) - 8;
  const kx = (sx+ex)/2 + s*6, ky = (sy+ey)/2 - 10;
  const d = `M${sx} ${sy} Q${kx} ${ky} ${ex} ${ey}`;
  return `<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="10" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="${farbe}" stroke-width="5" stroke-linecap="round"/>
    <circle cx="${ex}" cy="${ey}" r="7.5" fill="${farbe}" stroke="var(--ink)" stroke-width="3"/>`;
}
function fluegel(P, s, farbe){
  const { bx, by } = P;
  const x = v => bx + s*v;
  return `<path d="M${x(14)} ${by-22} C${x(54)} ${by-30} ${x(78)} ${by-8} ${x(76)} ${by+18}
    Q${x(64)} ${by+6} ${x(54)} ${by+16} Q${x(42)} ${by+4} ${x(32)} ${by+14}
    Q${x(22)} ${by+2} ${x(13)} ${by+10} Z"
    fill="${farbe}" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>`;
}
function katzenschwanz(P, farbe){
  const { bx, by } = P;
  const d = `M${bx+26} ${by+18} q40 6 34-38 q-3-16 -16-12`;
  return `<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="17" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="${farbe}" stroke-width="11" stroke-linecap="round"/>
    <path d="M${bx+52} ${by+12} l6 6 M${bx+63} ${by-8} l8 3 M${bx+62} ${by-26} l8 1"
      stroke="var(--ink)" stroke-width="4" stroke-linecap="round" opacity=".55"/>`;
}
function schwanzflosse(P, farbe){
  const { bx, by } = P;
  return `<path d="M${bx+8} ${by-6} q46-20 62 6 q-18 26 -62 12 z"
    fill="${farbe}" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M${bx+30} ${by-2} q16 4 26 8" fill="none" stroke="var(--ink)" stroke-width="3" opacity=".4"/>`;
}

/* Baut die Figur: Stufe bestimmt Haltung und Ausrüstung, Art die Silhouette. */
function avatarSvg(stufe, artId){
  const s = clamp(stufe,1,7);
  const A = artId ? artVon(artId) : meineArt();
  const name = (S && S.profile && S.profile.avatarName) || A.stufe1Name;
  return `<svg class="avatar" viewBox="0 0 200 220" role="img"
    aria-label="${esc(name)}, ${esc(A.name)} auf Stufe ${s}: ${STUFEN_BESCHREIBUNG[s-1]}">
    ${AVATARE[s-1](A)}
  </svg>`;
}

/* --- E.1  Rückmeldungen ------------------------------------------------- */
function melde(text){                       /* für Screenreader (aria-live) */
  const el = $("#live"); if (el) el.textContent = text;
}
let toastTimer = null;
function toast(text){
  $$(".toast").forEach(t => t.remove());
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = text;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3200);
}
function bewegungAus(){
  return S.settings.reducedMotion ||
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}
function konfetti(){
  if (bewegungAus()) return;
  const box = document.createElement("div");
  box.className = "confetti"; box.setAttribute("aria-hidden","true");
  const farben = ["var(--sakura)","var(--mint)","var(--himmel)","var(--lavendel)","var(--butter)","var(--koralle)"];
  for (let i=0;i<60;i++){
    const p = document.createElement("i");
    p.style.left = Math.random()*100 + "vw";
    p.style.background = farben[i % farben.length];
    p.style.animationDuration = (1.6 + Math.random()*1.4) + "s";
    p.style.animationDelay = (Math.random()*0.5) + "s";
    p.style.transform = "rotate(" + Math.random()*360 + "deg)";
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3600);
}
/* Hält den Fokus in einem Dialog und sperrt den Hintergrund.
   Wichtig vor allem für die Ruhe-Insel: Wer mit Tastatur oder Screenreader
   unterwegs ist, darf im Akutmodus nicht hinter den Dialog rutschen.
   Liefert eine Aufräumfunktion zurück. */
function dialogFokusFangen(box){
  const auswahl = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
  const sichtbare = () => Array.from(box.querySelectorAll(auswahl))
    .filter(el => !el.disabled && el.getClientRects().length > 0);
  const fang = e => {
    if (e.key !== "Tab") return;
    const ziele = sichtbare();
    if (!ziele.length) return;
    const erster = ziele[0], letzter = ziele[ziele.length - 1];
    if (!box.contains(document.activeElement)){ e.preventDefault(); erster.focus(); return; }
    if (e.shiftKey && document.activeElement === erster){ e.preventDefault(); letzter.focus(); }
    else if (!e.shiftKey && document.activeElement === letzter){ e.preventDefault(); erster.focus(); }
  };
  document.addEventListener("keydown", fang, true);
  const vorher = document.body.style.overflow;
  document.body.style.overflow = "hidden";
  return () => {
    document.removeEventListener("keydown", fang, true);
    document.body.style.overflow = vorher;
  };
}

/* Allgemeines Overlay mit Fokusfang */
function overlay(inhaltHtml, beimSchliessen){
  const root = $("#overlay-root");
  root.innerHTML = `<div class="overlay" role="dialog" aria-modal="true">
      <div class="card stack">${inhaltHtml}</div></div>`;
  const box = root.querySelector(".card");
  const aufraeumen = dialogFokusFangen(root.querySelector(".overlay"));
  const schliessen = () => { aufraeumen(); root.innerHTML = ""; if (beimSchliessen) beimSchliessen(); };
  root.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", schliessen));
  root.querySelector(".overlay").addEventListener("keydown", e => {
    if (e.key === "Escape") schliessen();
  });
  const fokus = box.querySelector("button, a, input, textarea, select");
  if (fokus) fokus.focus();
  return schliessen;
}

/* Behandlungspfad: kompakte Zeile auf dem Heim-Screen, volle Karte in den
   Übungen. Verschwindet vom Heim-Screen, sobald alle Module durch sind. */
function kursHeimZeile(){
  const f = kursFortschritt();
  if (f.fertig >= f.gesamt) return "";
  const naechstes = KURS_MODULE.find(m => !modulFertig(m.id));
  return `<button class="quest" data-modul="${naechstes.id}">
    <span class="ic">${katIcon("kognitiv")}</span>
    <span class="grow">
      <h3>Behandlungspfad · Modul ${KURS_MODULE.indexOf(naechstes)+1}</h3>
      <span class="small muted">${esc(naechstes.titel)} · ${f.fertig} von ${f.gesamt} abgeschlossen</span>
    </span>
  </button>`;
}
function kursKarteHtml(){
  const f = kursFortschritt();
  return `<div class="card stack" data-titel="Behandlungspfad">
    <h2 style="margin:0">Der Weg durch die Angst – in sechs Schritten</h2>
    <p class="small">Aufgebaut wie eine kognitive Verhaltenstherapie bei Panikstörung und
      Agoraphobie: verstehen, eigenes Modell, Gedanken prüfen, Sicherheitsverhalten abbauen,
      Vermeidung abbauen, vorbeugen.</p>
    <div class="xpbar" style="height:18px" role="img" aria-label="${f.fertig} von ${f.gesamt} Modulen">
      <i style="width:${Math.round(f.fertig/f.gesamt*100)}%"></i></div>
    <button class="btn sm primary" data-go="kurs">${f.fertig ? "Weiter im Pfad" : "Pfad ansehen"}</button>

/* Der Gipfel bekommt auf dem Heim-Screen eine eigene Karte – er ist das
   Erste, was morgens sichtbar sein soll. */
function gipfelHeimKarte(){
  if (!S.gipfel){
    return `<div class="card soft stack" data-titel="Mein Gipfel">
      <h3 style="margin:0">Ein eigenes großes Ziel</h3>
      <p class="small">Eine Situation, der du ausweichst – zerlegt in Etappen, Schritt für Schritt.
         Dafür gibt es den größten Punktegewinn der App.</p>
      <button class="btn sm" data-go="gipfel">Gipfel ansehen</button>
    </div>`;
  }
  if (S.gipfel.status === "abgeschlossen"){
    return `<div class="card soft stack" data-titel="Mein Gipfel">
      <h3 style="margin:0">Geschafft: ${esc(S.gipfel.titel)}</h3>
      <button class="btn sm primary" data-go="gipfel">Urkunde ansehen</button>
    </div>`;
  }
  const f = gipfelFortschritt();
  const n = naechsteEtappe();
  return `<div class="card stack" data-titel="Mein Gipfel">
    <h3 style="margin:0">${esc(S.gipfel.titel)}</h3>

function questKarte(q, index, mitTausch){
  const elite = q.kategorie === "elite" || q.elite;
  const erledigt = S.daily.done.includes(q.id) ||
    S.completions.some(c => c.questId===q.id && c.date===heute());
  const punkte = Object.keys(q.attribute).map(k =>
    `<span class="pill ${k}">${attrIcon(k)} +${q.attribute[k]}</span>`).join("");
  return `<div class="stack">
    <button class="quest ${erledigt?'done':''} ${elite?'elite':''}" data-go-quest="${q.id}">
      <span class="ic">${elite ? SYMBOLE.elite_ic : katIcon(q.kategorie)}</span>
      <span class="grow">
        <h3>${esc(mitNamen(q.titel))}</h3>
        <span class="small muted">${elite ? "★ Elite · mit " + esc(elitePartner()) + " · " : ""}${q.dauerMin} Min · ${esc(kategorieName(q.kategorie))}</span>
        <span class="meta">${punkte}</span>
      </span>
    </button>
    ${mitTausch && !erledigt ? `<div class="row"><button class="btn sm ghost" data-tausch="${index}">Andere Übung vorschlagen</button></div>` : ""}
  </div>`;
}
const KATEGORIE_NAMEN = {
  atem:"Atem & Entspannung", bewegung:"Bewegung & Rhythmus", kognitiv:"KVT · Kopfarbeit",

const kategorieName = k => KATEGORIE_NAMEN[k] || k;
function karteDesTages(){
  const i = seedZahl(heute()) % WISSENSKARTEN.length;
