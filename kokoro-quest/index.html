/* --- E.7  Quest-Detail ---------------------------------------------------
   Ablauf: Stimmung vorher → Anleitung + Werkzeug → Abschluss →
   Stimmung nachher → Karte „Warum das wirkt“.                             */
let QSTATE = { id:null, phase:"vor", moodBefore:5, moodAfter:5, note:"", felder:{} };
function screenQuest(id){
  const q = questById(id);
  if (!q) return `<div class="card">Diese Übung gibt es nicht (mehr).
    <button class="btn sm" data-go="heim">Zurück</button></div>`;
  if (QSTATE.id !== id) QSTATE = { id:id, phase:"vor", moodBefore:5, moodAfter:5, note:"", felder:{} };

  const punkte = Object.keys(q.attribute).map(k =>
    `<span class="pill ${k}">${attrIcon(k)} ${ATTRIBUTE[k].name} +${q.attribute[k]}</span>`).join("");

  if (QSTATE.phase === "fertig"){
    return `<div class="stack" style="padding-top:14px">
      <div class="card stack" data-titel="Erledigt">
        <h1>Geschafft: ${esc(mitNamen(q.titel))}</h1>
        <p class="center" style="font-size:2rem">🌸</p>
        <div class="why"><h3>Warum das wirkt</h3><p>${esc(mitNamen(q.warumEsWirkt))}</p></div>
        ${QSTATE.moodBefore!=null&&QSTATE.moodAfter!=null ? `<p class="small muted">
          Deine Einschätzung: vorher ${QSTATE.moodBefore} – nachher ${QSTATE.moodAfter}.
          Das ist keine Bewertung, nur dein persönlicher Verlauf.</p>`:""}
        <button class="btn primary block" data-go="heim">Zurück nach Hause</button>
        <button class="btn ghost block" data-go="bibliothek">Noch eine Übung suchen</button>
      </div></div>`;
  }

  return `<div class="stack" style="padding-top:14px">
    <button class="btn sm ghost" data-go="heim">← Zurück</button>
    <div class="card stack" data-titel="${esc(kategorieName(q.kategorie))}">
      <h1>${esc(mitNamen(q.titel))}</h1>
      <div class="row">
        <span class="pill">${q.dauerMin} Min</span>
        <span class="pill">${esc(kategorieName(q.kategorie))}</span>
        <span class="pill">${q.intensitaet === "sanft" ? "sanft" : "normal"}</span>
        ${punkte}
      </div>
      ${q.kategorie === "elite" ? `<div class="elite-band">★ Elite-Aktivität – zusammen mit
        <strong>${esc(elitePartner())}</strong>. Diese Quests zählen doppelt für deine Verbundenheit
        und werden dreimal pro Woche vorgeschlagen.</div>` : ""}
      ${q.sicherheitshinweis ? `<div class="warnbox"><strong>Hinweis:</strong> ${esc(mitNamen(q.sicherheitshinweis))}</div>` : ""}
    </div>

    ${QSTATE.phase === "vor" ? `
    <div class="card stack" data-titel="Check-in">
      <h2>Wie geht es dir gerade?</h2>
      <label for="mood-vor">Anspannung / Angst von 0 (ruhig) bis 10 (sehr stark)</label>
      <input type="range" id="mood-vor" min="0" max="10" step="1" value="${QSTATE.moodBefore}">
      <p class="center" aria-hidden="true"><strong id="mood-vor-wert">${QSTATE.moodBefore}</strong> / 10</p>
      <p class="small muted">Nur für deinen eigenen Verlauf. Es gibt hier kein „zu hoch“ und kein „zu niedrig“.</p>
    </div>` : ""}

    <div class="card stack" data-titel="Anleitung">
      <h2>So geht's</h2>
      <ol class="steps">${q.anleitung.map(s => `<li>${esc(mitNamen(s))}</li>`).join("")}</ol>
    </div>

    ${werkzeugHtml(q)}

    ${QSTATE.phase === "nach" ? `
    <div class="card stack" data-titel="Danach">
      <h2>Und jetzt?</h2>
      <label for="mood-nach">Anspannung / Angst von 0 bis 10</label>
      <input type="range" id="mood-nach" min="0" max="10" step="1" value="${QSTATE.moodAfter}">
      <p class="center" aria-hidden="true"><strong id="mood-nach-wert">${QSTATE.moodAfter}</strong> / 10</p>
      <div class="field">
        <label for="quest-note">Notiz (freiwillig)</label>
        <textarea id="quest-note" maxlength="600" placeholder="Was ist dir aufgefallen?"></textarea>
      </div>
      <button class="btn primary block" id="btn-quest-final">Übung eintragen</button>
      <p class="small muted center">Auch wenn die Zahl gestiegen ist: Die Übung zählt.
         Nicht der Effekt am einzelnen Tag macht den Unterschied, sondern die Wiederholung.</p>
    </div>` : `
    <button class="btn primary block" id="btn-quest-done">Übung abgeschlossen</button>`}
  </div>`;
}

/* --- E.8  Werkzeuge im Quest-Screen ------------------------------------- */
function werkzeugHtml(q){
  switch (q.tool){
    case "atem": return atemHtml(q);
    case "timer": return timerHtml(q.dauerMin);
    case "pmr": return timerHtml(q.dauerMin) + gefuehrtHtml(PMR_SCHRITTE, "Muskelgruppen der Reihe nach");
    case "bodyscan": return timerHtml(q.dauerMin) + gefuehrtHtml(BODYSCAN_SCHRITTE, "Stationen der Körperreise");
    case "grounding": return groundingHtml();
    case "gedankenprotokoll": return gedankenprotokollHtml();
    case "katastrophe": return katastropheHtml();
    case "teufelskreis": return teufelskreisHtml();
    case "wissenskarte": return wissenskarteHtml();
    case "angsttagebuch": return angsttagebuchHtml();
    case "copingkarten": return copingHtml();
    case "blaetter": return blaetterHtml();
    case "werte": return werteHtml();
    case "playlist": return playlistHtml();
    case "vermeidung": return vermeidungHtml();
    case "sprosse": return sprosseHtml();
    case "exporeview": return exoReviewHtml();
    case "panikprotokoll": return panikprotokollHtml();
    case "abc": return abcHtml();
    case "reattribution": return reattributionHtml();
    case "experiment": return experimentHtml();
    case "notfallkarte": return notfallkarteHtml();
    case "fruehwarn": return fruehwarnHtml();
    case "regeln-gold": return regelnHtml("gold");
    case "regeln-rueckschlag": return regelnHtml("rueckschlag");
    default: return "";
  }
}

/* --- Reattribution mit Kuchendiagramm ------------------------------------ */
const KUCHEN_FARBEN = ["var(--koralle)","var(--himmel)","var(--mint)","var(--butter)","var(--lavendel)"];
function kuchenSvg(teile){
  const summe = teile.reduce((a,t) => a + t.wert, 0) || 1;
  let winkel = -Math.PI/2;
  const r = 62, cx = 70, cy = 70;
  const stuecke = teile.map((t,i) => {
    const anteil = t.wert / summe;
    if (anteil <= 0) return "";
    const ende = winkel + anteil * Math.PI * 2;
    const gross = anteil > 0.5 ? 1 : 0;
    const x1 = cx + Math.cos(winkel)*r, y1 = cy + Math.sin(winkel)*r;
    const x2 = cx + Math.cos(ende)*r,   y2 = cy + Math.sin(ende)*r;
    const d = anteil >= 0.999
      ? `M${cx} ${cy-r} A${r} ${r} 0 1 1 ${cx-0.01} ${cy-r} Z`
      : `M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${gross} 1 ${x2} ${y2} Z`;
    winkel = ende;
    return `<path d="${d}" fill="${KUCHEN_FARBEN[i % KUCHEN_FARBEN.length]}"
      stroke="var(--ink-dunkel)" stroke-width="3" stroke-linejoin="round"/>`;
  }).join("");
  return `<svg viewBox="0 0 140 140" style="width:150px;height:150px" role="img"
      aria-label="Kuchendiagramm: ${teile.map(t => t.label + " " + Math.round(t.wert/summe*100) + " Prozent").join(", ")}">
    ${stuecke}</svg>`;
}

      <input type="range" id="re-p0" data-feld="prozentKatastrophe" data-kuchen="0" min="0" max="100" step="5" value="60"></div>

function radarSvg(){
  const max = Math.max(300, ...ATTR_KEYS.map(k => S.xp[k]));
  const cx=110, cy=110, r=74;
  const winkel = [-90, 0, 90, 180];               // oben, rechts, unten, links
  const punkt = (i, f) => {
    const w = winkel[i] * Math.PI/180;
    return [cx + Math.cos(w)*r*f, cy + Math.sin(w)*r*f];
  };
  const netz = [0.25,0.5,0.75,1].map(f =>
    `<polygon points="${[0,1,2,3].map(i => punkt(i,f).join(",")).join(" ")}"
      fill="none" stroke="var(--line)" stroke-width="2"/>`).join("");
  const achsen = [0,1,2,3].map(i =>
    `<line x1="${cx}" y1="${cy}" x2="${punkt(i,1)[0]}" y2="${punkt(i,1)[1]}" stroke="var(--line)" stroke-width="2"/>`).join("");
  const werte = ATTR_KEYS.map((k,i) => punkt(i, clamp(S.xp[k]/max,0.02,1)).join(",")).join(" ");
  /* Beschriftung als farbige Symbol-Marken direkt an den Achsen –
     ausgeschriebene Namen stehen als Pillen unter dem Diagramm.          */
  const marken = ATTR_KEYS.map((k,i) => {
    const p = punkt(i, 1.24);
    return `<g transform="translate(${p[0]},${p[1]})">
      <circle r="15" fill="${ATTRIBUTE[k].farbe}" stroke="var(--ink-dunkel)" stroke-width="2.6"/>
      <g transform="translate(-9,-9)" color="var(--ink-dunkel)">
        <svg viewBox="0 0 24 24" width="18" height="18">${SYMBOLE[k]}</svg>
      </g></g>`;
  }).join("");
  return `<svg viewBox="0 0 220 220" style="width:100%;max-width:320px;margin:0 auto;display:block"
      role="img" aria-label="Radar-Diagramm: ${ATTR_KEYS.map(k=>ATTRIBUTE[k].name+" "+S.xp[k]+" Punkte").join(", ")}">
    ${netz}${achsen}
    <polygon points="${werte}" fill="var(--sakura)" fill-opacity=".55" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
    ${ATTR_KEYS.map((k,i) => { const p = punkt(i, clamp(S.xp[k]/max,0.02,1));
      return `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${ATTRIBUTE[k].farbe}" stroke="var(--ink)" stroke-width="2.4"/>`; }).join("")}
    ${marken}
  </svg>`;
}
function heatmapHtml(){
  const proTag = {};
  S.completions.forEach(c => { proTag[c.date] = (proTag[c.date]||0)+1; });
  const wochen = 13;
  const heuteD = new Date(); heuteD.setHours(12,0,0,0);
  const wochentag = (heuteD.getDay()+6)%7;                 // Montag = 0
  const ende = new Date(heuteD); ende.setDate(ende.getDate() + (6-wochentag));
  const zellen = [];
  for (let reihe=0; reihe<7; reihe++){
    for (let sp=0; sp<wochen; sp++){
      const d = new Date(ende);
      d.setDate(ende.getDate() - ((wochen-1-sp)*7) - (6-reihe));
      const iso = d.toISOString().slice(0,10);
      const n = proTag[iso]||0;
      const stufe = n===0?0 : n===1?1 : n===2?2 : 3;
      const zukunft = d > heuteD;
      zellen.push(`<i data-l="${zukunft?0:stufe}" title="${datumDe(iso)}: ${zukunft?"–":n+" Übung(en)"}"></i>`);
    }
  }
  return `<div class="heat" role="img" aria-label="Kalender der aktiven Tage der letzten 13 Wochen">${zellen.join("")}</div>`;
}
function verlaufSvg(){
  const eintraege = S.journal.filter(j => j.type === "angsttagebuch" && j.fields &&
      j.fields.intensitaet != null).slice(-30);
  if (eintraege.length < 2){
    return `<p class="small muted">Sobald du zwei Einträge im Angst-Tagebuch hast, erscheint hier eine Kurve.</p>`;
  }
  const w=300, h=140, pad=24;
  const punkte = eintraege.map((e,i) => {
    const x = pad + i*(w-2*pad)/(eintraege.length-1);
    const y = h-pad - (Number(e.fields.intensitaet)/10)*(h-2*pad);
    return [x,y];
  });
  const linie = punkte.map(p => p.join(",")).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto"
      role="img" aria-label="Verlauf der Angstwerte, ${eintraege.length} Einträge, zuletzt ${eintraege[eintraege.length-1].fields.intensitaet} von 10">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="2"/>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="2"/>
    <text x="4" y="${pad+4}" font-size="10" fill="var(--text-muted)">10</text>
    <text x="8" y="${h-pad}" font-size="10" fill="var(--text-muted)">0</text>
    <polyline points="${linie}" fill="none" stroke="var(--at-geist)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${punkte.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--sakura)" stroke="var(--ink)" stroke-width="2"/>`).join("")}
  </svg>`;
}

/* ===========================================================================
   §E.12  MEIN GIPFEL  ·  die selbst gesetzte Herausforderung
   ---------------------------------------------------------------------------
   Eine einzige, selbst gewählte Konfrontation, die über mehrere Etappen und
   Wiederholungen geht – nicht an einem Tag. Der Punkte-Bonus am Ende ist
   bewusst groß, aber so gebaut, dass er niemanden ins Risiko zieht:
     · ein Abbruch zahlt echte Punkte, nie null
     · kein Countdown, kein Ablaufdatum, kein Vergleich mit anderen
     · der Gipfel-Bonus läuft OHNE Serien-Multiplikator, damit die größte
       Leistung der App nicht davon abhängt, ob gerade eine Serie läuft
     · Etappen zahlen einzeln – wer die Leiter wirklich geht, bekommt mehr,
       ohne dass jemand für den direkten Weg getadelt oder gesperrt wird
   Fachlich: graduierte Exposition in vivo. Zusätzlich zur Habituation
   („bleiben, bis die Angst nachlässt") wird mit Erwartungsverletzung
   gearbeitet – Vorhersage vorher, Abgleich nachher.
   =========================================================================== */

const GIPFEL_BONUS = z => 150 + 3 * clamp(Number(z)||0, 0, 100);
const GIPFEL_CHECKS = [
  "Ich will mich einer Situation stellen, die ich meide – ich will keine Körpersymptome absichtlich auslösen.",
  "Was ich vorhabe, ist an sich nicht gefährlich: nichts im Straßenverkehr, nichts im Wasser, nichts in der Höhe ohne Sicherung.",
  "Ich darf jederzeit aufhören. Das ist eingeplant und kein Scheitern."
];
const GIPFEL_AUSGESCHLOSSEN =
  "Nicht geeignet sind Vorhaben, die Panik-Symptome erzeugen sollen: absichtlich schnell atmen, " +
  "sich bis zum Schwindel drehen, die Luft anhalten, sich hochkoffeinieren. Solche Übungen wirken, " +
  "gehören aber in therapeutische Begleitung – nicht in eine App, die du allein bedienst.";

const gipfelAktiv = () => S.gipfel && S.gipfel.status === "aktiv";
const etappeVon = id => (S.gipfel ? (S.gipfel.etappen || []).find(e => e.id === id) : null);
const durchgaengeVon = id => (S.gipfel ? (S.gipfel.durchgaenge || []).filter(d => d.etappeId === id) : []);
/* Die niedrigste Etappe, die noch offen ist – der natürliche nächste Schritt. */
function naechsteEtappe(){
  if (!gipfelAktiv()) return null;
  const offen = S.gipfel.etappen.filter(e => e.status !== "geschafft");
  return offen.length ? offen[0] : null;
}
function gipfelFortschritt(){
  if (!S.gipfel) return { geschafft:0, gesamt:0, prozent:0 };
  const gesamt = S.gipfel.etappen.length || 1;
  const geschafft = S.gipfel.etappen.filter(e => e.status === "geschafft").length;
  return { geschafft, gesamt, prozent: Math.round(geschafft/gesamt*100) };
}

/* --- Berg-Grafik: die Figur klettert mit jeder Etappe höher -------------- */
function bergSvg(){
  const { geschafft, gesamt } = gipfelFortschritt();
  const n = Math.max(1, gesamt);
  const pos = i => {
    const t = i / n;
    return [38 + t*122 + (i % 2 ? 12 : -4), 176 - t*128];
  };
  const stationen = S.gipfel.etappen.map((e,i) => {
    const [x,y] = pos(i);
    const fertig = e.status === "geschafft";
    return `<g>
      <circle cx="${x}" cy="${y}" r="9" fill="${fertig ? 'var(--mint)' : 'var(--surface)'}"
        stroke="var(--ink-dunkel)" stroke-width="3"/>

      <text x="${x+14}" y="${y+4}" font-size="10" font-weight="800" fill="var(--text)">${i+1}</text>
    </g>`;
  }).join("");
  const [fx,fy] = pos(geschafft);
  return `<svg viewBox="0 0 320 200" style="width:100%;height:auto" role="img"
      aria-label="Berg mit ${gesamt} Etappen, ${geschafft} davon geschafft">
    <rect x="0" y="0" width="320" height="200" fill="var(--himmel)" opacity=".28" rx="8"/>
    <path d="M0 186 L96 62 L150 120 L206 34 L320 186 Z" fill="var(--lavendel)"
      stroke="var(--ink-dunkel)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M206 34 L186 60 q12 8 22 0 q10 8 20 0 Z" fill="#FFF8F3" stroke="var(--ink-dunkel)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M206 30 l26 8 -26 10z" fill="var(--koralle)" stroke="var(--ink-dunkel)" stroke-width="3" stroke-linejoin="round"/>
    <line x1="206" y1="24" x2="206" y2="52" stroke="var(--ink-dunkel)" stroke-width="3" stroke-linecap="round"/>
    <path d="M38 178 L170 44" fill="none" stroke="var(--ink-dunkel)" stroke-width="3" stroke-dasharray="5 8" stroke-linecap="round" opacity=".6"/>
    ${stationen}
    <g transform="translate(${fx-30},${fy-62}) scale(0.3)">${avatarSvg(S.level)}</g>
  </svg>`;
}

function gipfelKurve(){
  const d = S.gipfel.durchgaenge.slice(-14);
  if (d.length < 2) return `<p class="small muted">Ab dem zweiten Durchgang entsteht hier eine Kurve.</p>`;
  const w=300,h=130,pad=24;
  const pkt = (v,i) => [ pad + i*(w-2*pad)/(d.length-1), h-pad - (Number(v)/10)*(h-2*pad) ];
  const linie = k => d.map((x,i) => pkt(x[k],i).join(",")).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img"
      aria-label="Höhepunkt der Angst über ${d.length} Durchgänge, zuletzt ${d[d.length-1].sudHoch} von 10">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="2"/>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="2"/>
    <text x="4" y="${pad+4}" font-size="10" fill="var(--text-muted)">10</text>

/* --- Einrichtung in vier Schritten --------------------------------------- */

  const schritte = [
    `<div class="card stack" data-titel="Schritt 1 von 4">

       <div class="field">
         <label for="gs-sud">Wie viel Angst löst allein die Vorstellung aus? <span id="gs-sud-wert">${G.zielSud}</span> von 100</label>

       </div>
       <div id="gs-hinweis">${G.zielSud >= 80 ? gipfelBegleitungHinweis() : ""}</div>

     </div>`,
    `<div class="card stack" data-titel="Schritt 2 von 4">
       <h2>Kurzer Sicherheits-Check</h2>
       <div class="warnbox">${esc(GIPFEL_AUSGESCHLOSSEN)}</div>
       ${GIPFEL_CHECKS.map((t,i) => `<label class="row" style="align-items:flex-start;gap:8px">
         <input type="checkbox" data-check="${i}" style="width:auto;margin-top:4px" ${G.checks[i]?"checked":""}>

       <button class="btn primary block" data-gs="2">Weiter</button>
       <button class="btn ghost block" data-gs="0">Zurück</button>
     </div>`,
    `<div class="card stack" data-titel="Schritt 3 von 4">
       <h2>In Etappen zerlegen</h2>
       <p class="small">Drei bis sieben Schritte. Die erste Etappe sollte bei etwa 40 oder darunter

       ${S.avoidanceMap.length ? `<button class="btn sm mint block" id="gs-import">

       <div id="gs-etappen">${setupEtappenHtml()}</div>
       ${GSETUP.etappen.length && Math.min(...GSETUP.etappen.map(e=>e.sud)) > 50 ? `

       <div class="field"><label for="gs-et-text">Neue Etappe</label>
         <input type="text" id="gs-et-text" maxlength="140" placeholder="z. B. drei Haltestellen mit dem Bus"></div>
       <div class="row">
         <div class="grow"><label for="gs-et-sud">SUD <span id="gs-et-sud-wert">40</span></label>
           <input type="range" id="gs-et-sud" min="0" max="100" step="5" value="40"></div>
         <div style="width:96px"><label for="gs-et-min">Minuten</label>
           <input type="number" id="gs-et-min" min="1" max="240" value="20"></div>

       <div class="field"><label for="gs-ausstieg">Mein Ausstiegssatz</label>

         <input type="text" id="gs-verbuendeter" maxlength="80" value="${esc(G.verbuendeter)}"

function gipfelBegleitungHinweis(){
  return `<div class="warnbox">Das ist eine große Sache. In dieser Größenordnung ist es mit
    therapeutischer Begleitung deutlich leichter – das ist keine Absage an dich, sondern die
    passende Werkzeugkiste. Du kannst trotzdem loslegen: kleine Etappen zählen genauso.</div>`;
}
function setupEtappenHtml(){
  const G = GSETUP;
  if (!G.etappen.length) return `<p class="small muted">Noch keine Etappen.</p>`;
  return `<ol class="stack" style="padding-left:20px">${G.etappen.map(e => `<li>
    <div class="row between"><span class="grow"><strong>${esc(e.text)}</strong>
      <span class="small muted">· SUD ${e.sud} · ${e.geplanteMin} Min</span></span>
      <button class="btn sm ghost" data-gs-del="${esc(e.id)}" aria-label="Etappe entfernen">×</button>
    </div></li>`).join("")}</ol>`;
}

/* --- Ein Durchgang ------------------------------------------------------- */
let DSTATE = null;
function screenDurchgang(){
  if (!DSTATE || !S.gipfel) return screenGipfel();
  const e = etappeVon(DSTATE.etappeId);
  if (!e) return screenGipfel();
  const nr = S.gipfel.etappen.indexOf(e) + 1;

  if (DSTATE.phase === "vor") return `<div class="stack" style="padding-top:14px">
    <h1>Etappe ${nr}</h1>
    <div class="card stack" data-titel="Vorbereitung">
      <h2 style="margin:0">${esc(e.text)}</h2>
      <p class="small muted">Geplant: ${e.geplanteMin} Minuten${e.ohneSicherheit ? " · ohne " + esc(e.ohneSicherheit) : ""}</p>
      <div class="field"><label for="dg-vorhersage">Was befürchtest du konkret?</label>
        <textarea id="dg-vorhersage" maxlength="400" placeholder="Möglichst wörtlich – das wird gleich der Vergleich."></textarea></div>
      <div class="field">
        <label for="dg-wahr">Wie wahrscheinlich hältst du das? <span id="dg-wahr-wert">50</span> %</label>
        <input type="range" id="dg-wahr" min="0" max="100" step="5" value="50">
      </div>
      <div class="field">
        <label for="dg-vorher">Angst jetzt gerade <span id="dg-vorher-wert">5</span> von 10</label>
        <input type="range" id="dg-vorher" min="0" max="10" value="5">
      </div>
      <div class="warnbox">Bleib in der Situation, bis die Angst spürbar nachlässt oder die geplante
        Zeit vorbei ist. Und: Aufhören ist erlaubt und zählt – der Knopf dafür ist die ganze Zeit da.</div>
      <button class="btn primary block" id="btn-dg-los">Los geht's</button>
      <button class="btn ghost block" data-go="gipfel">Doch nicht jetzt</button>
    </div></div>`;

  if (DSTATE.phase === "laeuft"){
    const saetze = S.copingCards.length ? S.copingCards.map(c => c.text) : COPING_VORLAGEN.slice(0,3);
    return `<div class="stack" style="padding-top:14px">
      <div class="card stack" data-titel="Läuft">
        <h2 style="margin:0">${esc(e.text)}</h2>
        <p class="center" style="font-size:2.6rem;font-weight:800" id="dg-uhr">00:00</p>
        <p class="center small muted">geplant: ${e.geplanteMin} Minuten</p>
        <div class="stack">
          ${saetze.map(t => `<div class="bubble"><strong>„${esc(t)}“</strong></div>`).join("")}
        </div>
        <button class="btn primary block" id="btn-dg-durch">Ich bin durch</button>
        <button class="btn block" id="btn-dg-stop">Ich höre hier auf</button>
        <p class="small muted center">Beides zählt. Aufhören gibt Punkte, nicht null –
          angefangen zu haben ist der schwere Teil.</p>
      </div></div>`;
  }

  /* Auswertung */
  return `<div class="stack" style="padding-top:14px">
    <h1>Rückblick</h1>
    <div class="card stack" data-titel="Auswertung">
      ${DSTATE.vorhersage ? `<div class="why"><strong>Du hattest befürchtet:</strong>
        <br>„${esc(DSTATE.vorhersage)}“ – für ${DSTATE.wahrscheinlichkeit} % wahrscheinlich gehalten.</div>` : ""}
      <div class="field">
        <label for="dg-hoch">Angst auf dem Höhepunkt <span id="dg-hoch-wert">7</span> von 10</label>
        <input type="range" id="dg-hoch" min="0" max="10" value="7">
      </div>
      <div class="field">
        <label for="dg-nach">Angst am Ende <span id="dg-nach-wert">4</span> von 10</label>
        <input type="range" id="dg-nach" min="0" max="10" value="4">
      </div>
      <div class="field"><label for="dg-passiert">Was ist tatsächlich passiert?</label>
        <textarea id="dg-passiert" maxlength="600"></textarea></div>
      <div class="field"><label for="dg-erkenntnis">Was sagt dir das über deine Befürchtung?</label>
        <textarea id="dg-erkenntnis" maxlength="600" placeholder="Der Vergleich ist der eigentliche Wirkstoff."></textarea></div>
      <button class="btn primary block" id="btn-dg-fertig">Durchgang eintragen</button>
    </div></div>`;
}

/* --- Urkunde ------------------------------------------------------------- */

/* --- D.3  Medaillen-Grafik ----------------------------------------------- */
function medailleSvg(m, stufe, groesse){
  const st = MEDAILLEN_STUFEN[clamp(stufe,1,3)-1];
  const g = groesse || 72;
  const glyph = SYMBOLE[m.symbol] || SYMBOLE.verbundenheit;
  return `<svg viewBox="0 0 72 92" width="${g}" height="${g*92/72}" aria-hidden="true" class="medaille-svg">
    <path d="M20 4 L30 40 L20 44 L10 20 Z" fill="var(--himmel)" stroke="var(--ink-dunkel)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M52 4 L62 20 L52 44 L42 40 Z" fill="var(--sakura)" stroke="var(--ink-dunkel)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="36" cy="60" r="26" fill="${st.farbe}" stroke="var(--ink-dunkel)" stroke-width="3.5"/>
    <circle cx="36" cy="60" r="19" fill="none" stroke="${st.glanz}" stroke-width="3"/>
    <path d="M22 48 a20 20 0 0 1 12-6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" opacity=".85"/>
    <g transform="translate(24,48)" color="var(--ink-dunkel)">
      <svg viewBox="0 0 24 24" width="24" height="24">${glyph}</svg>
    </g>
    ${stufe >= 3 ? `<g fill="#fff" stroke="var(--ink-dunkel)" stroke-width="1.6">
      <path d="M64 44 l2 5 5 2 -5 2 -2 5 -2-5 -5-2 5-2z"/>
      <path d="M8 62 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6-4 -4-1.6 4-1.6z"/></g>` : ""}
  </svg>`;
}

/* --- Medaillenreihe neben dem Avatar (nur Gold) --------------------------- */
function goldReiheHtml(){
  const gold = goldMedaillen();
  if (!gold.length){
    const offen = MEDAILLEN.map(m => ({ m, st: medaillenStand(m) }))
      .filter(x => x.st.stufe < 3)
      .sort((a,b) => (b.st.wert / b.m.stufen[2]) - (a.st.wert / a.m.stufen[2]))[0];
    return `<button class="goldreihe leer" data-go="medaillen">
      <span class="small muted">Noch keine Goldmedaille${offen
        ? ` · am nächsten dran: ${esc(offen.m.name)} ${offen.st.wert}/${offen.m.stufen[2]}` : ""}</span>
    </button>`;
  }
  return `<button class="goldreihe" data-go="medaillen"
      aria-label="${gold.length} Goldmedaillen: ${gold.map(m=>m.name).join(", ")}. Öffnet die Medaillen.">
    ${gold.map(m => `<span class="gold-m" title="${esc(m.name)} – Gold">${medailleSvg(m,3,34)}</span>`).join("")}
    <span class="small" style="font-weight:800">${gold.length}× Gold</span>
  </button>`;
}

/* --- E.14  Medaillen-Bereich --------------------------------------------- */
function screenMedaillen(){
  const stand = MEDAILLEN.map(m => ({ m, st: medaillenStand(m) }));
  const gold = stand.filter(x => x.st.stufe >= 3).length;
  const gesamt = stand.reduce((a,x) => a + x.st.stufe, 0);
  return `<div class="stack" style="padding-top:14px">
    <h1>Medaillen</h1>
    <div class="card stack" data-titel="Vitrine">
      <p class="small">Medaillen zählen Ausdauer: dieselbe Art von Übung, viele Male gemacht.
         Jede hat drei Stufen. <strong>Goldmedaillen erscheinen neben deinem Avatar.</strong></p>
      <div class="row">
        <span class="statusfeld">${gold} × Gold</span>
        <span class="statusfeld">${gesamt} von ${MEDAILLEN.length*3} Stufen</span>
      </div>
      ${gold ? `<div class="vitrine">${stand.filter(x=>x.st.stufe>=3)
        .map(x => `<span>${medailleSvg(x.m,3,56)}</span>`).join("")}</div>`
        : `<p class="small muted">Die Vitrine ist noch leer. Das ist der normale Anfang.</p>`}
    </div>

    ${stand.map(x => {
      const { m, st } = x;
      const fertig = st.stufe >= 3;
      return `<div class="card stack medaille-karte ${fertig?'gold':''}" data-titel="${esc(m.name)}">
        <div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:12px">
          <span class="flex-none">${medailleSvg(m, Math.max(1,st.stufe), 58)}
            ${st.stufe === 0 ? '<span class="sr-only">noch keine Stufe erreicht</span>' : ''}</span>
          <span class="grow">
            <strong>${st.stufe ? esc(MEDAILLEN_STUFEN[st.stufe-1].name) + (fertig ? " – geschafft" : "")
                               : "Noch keine Stufe"}</strong>
            <div class="small muted">${st.wert} ${esc(m.einheit)}${fertig ? "" :
              " · noch " + Math.max(0, st.naechstesZiel - st.wert) + " bis " + esc(MEDAILLEN_STUFEN[st.stufe].name)}</div>
            <div class="xpbar" style="height:18px;margin-top:6px"
                 role="img" aria-label="${fertig ? 'Gold erreicht' : st.prozent + ' Prozent bis ' + st.naechstesZiel}">
              <i style="width:${st.prozent}%"></i></div>
            <div class="row small" style="margin-top:6px;gap:6px">
              ${m.stufen.map((z,i) => `<span class="stufenmarke ${st.stufe>i?'erreicht '+MEDAILLEN_STUFEN[i].key:''}">
                ${MEDAILLEN_STUFEN[i].name} ${z}</span>`).join("")}
            </div>
          </span>
        </div>
        <p class="small muted" style="margin:0">${esc(m.text)}</p>
      </div>`;
    }).join("")}

    <button class="btn ghost block" data-go="fortschritt">Zurück zum Verlauf</button>
  </div>`;
}

/* --- E.15  Behandlungspfad ----------------------------------------------
   Sechs Module in der Reihenfolge einer Verhaltenstherapie bei Panik und
   Agoraphobie. Nichts ist gesperrt: Die Reihenfolge ist eine Empfehlung.
   ------------------------------------------------------------------------ */
function screenKurs(){
  const f = kursFortschritt();
  const prozent = Math.round(f.fertig / f.gesamt * 100);
  return `<div class="stack" style="padding-top:14px">
    <h1>Behandlungspfad</h1>
    <div class="card stack" data-titel="Überblick">
      <p class="small">Die sechs Schritte, in denen eine kognitive Verhaltenstherapie bei
        Panikstörung und Agoraphobie üblicherweise vorgeht. Du kannst sie in dieser Reihenfolge
        durchgehen – gesperrt ist nichts.</p>
      <div class="xpbar" role="img" aria-label="${f.fertig} von ${f.gesamt} Modulen abgeschlossen">
        <i style="width:${prozent}%"></i></div>
      <p class="center small" style="margin:0"><strong>${f.fertig} von ${f.gesamt} Modulen</strong></p>
      <div class="warnbox">Das ist ein strukturiertes Selbsthilfe-Programm, keine Behandlung.
        Es folgt dem Aufbau einer Verhaltenstherapie, ersetzt sie aber nicht.</div>
    </div>

    ${KURS_MODULE.map((m,i) => {
      const fertig = modulFertig(m.id);
      const offen = KURS_MODULE.findIndex(x => !modulFertig(x.id));
      const dran = !fertig && i === offen;
      return `<button class="modulkarte ${fertig?'fertig':''} ${dran?'dran':''}" data-modul="${m.id}">
        <span class="nr">${fertig ? "✓" : i+1}</span>
        <span class="grow">
          <strong>${esc(m.titel)}</strong>
          <span class="small muted">${esc(m.ziel)}</span>
          <span class="small" style="display:block;margin-top:4px">
            ${m.karten.length} Karten · ${m.quests.length} Übungen${dran ? " · <strong>als Nächstes</strong>" : ""}</span>
        </span>
      </button>`;
    }).join("")}

    ${regelnKarteHtml()}
  </div>`;
}

/* Die beiden Regellisten – steht im Behandlungspfad und ganz oben im
   Journal, weil man sie im Zweifel schnell braucht. */
function regelnKarteHtml(){
  return `<div class="card stack" data-titel="Zum Nachlesen">
    <h2 style="margin:0">Die Regeln</h2>
    <p class="small">Zwei Listen, die im Ernstfall mehr helfen als jede Erklärung.</p>
    <button class="btn block primary" data-go="regeln">Die zehn goldenen Regeln</button>
    <button class="btn block" data-go="regeln-rueckschlag">Umgang mit Rückschlägen</button>
  </div>`;
}

function screenKursModul(id){
  const m = modulVon(id);
  if (!m) return screenKurs();
  const nr = KURS_MODULE.indexOf(m) + 1;
  const fertig = modulFertig(m.id);
  const karten = m.karten.map(k => WISSENSKARTEN.find(w => w.id === k)).filter(Boolean);
  const quests = m.quests.map(questById).filter(Boolean);
  const erledigt = quests.filter(q => S.completions.some(c => c.questId === q.id)).length;
  return `<div class="stack" style="padding-top:14px">
    <button class="btn sm ghost" data-go="kurs">← Behandlungspfad</button>
    <div class="card stack" data-titel="Modul ${nr}">
      <h1>${esc(m.titel)}</h1>
      <p><strong>Ziel:</strong> ${esc(m.ziel)}</p>
      <div class="bubble"><strong>${esc(m.merksatz)}</strong></div>
    </div>

    <div class="card stack" data-titel="Verstehen">
      <h2>Dazu solltest du wissen</h2>
      ${karten.map(k => `<details class="lernkarte">
        <summary>${esc(k.titel)}</summary>
        <p class="small" style="margin:8px 0 0">${esc(k.text)}</p>
      </details>`).join("")}
    </div>

    <div class="card stack" data-titel="Üben">
      <h2>Übungen dieses Moduls <span class="small muted">(${erledigt}/${quests.length})</span></h2>
      ${quests.map(q => `<button class="quest ${S.completions.some(c=>c.questId===q.id)?'done':''}" data-go-quest="${q.id}">
        <span class="ic">${katIcon(q.kategorie)}</span>
        <span class="grow"><h3>${esc(mitNamen(q.titel))}</h3>
          <span class="small muted">${q.dauerMin} Min · ${esc(kategorieName(q.kategorie))}</span></span>
      </button>`).join("")}
    </div>

    <div class="card stack" data-titel="Abschluss">
      ${fertig
        ? `<p><strong>Modul abgeschlossen.</strong> Du kannst jederzeit zurückkommen –
             die Karten und Übungen bleiben offen.</p>`
        : `<p class="small">Hak das Modul ab, wenn du die Karten gelesen und mindestens eine der
             Übungen gemacht hast. Du entscheidest das, nicht die App.</p>
           <button class="btn primary block" data-modul-fertig="${m.id}">Modul abschließen (+25 Geist)</button>`}
    </div>
  </div>`;
}

/* --- E.16  Die Regeln als Nachschlagewerk -------------------------------- */
function screenRegeln(art){
  const gold = art !== "rueckschlag";
  const liste = gold ? REGELN_GOLD : REGELN_RUECKSCHLAG;
  return `<div class="stack" style="padding-top:14px">
    <h1>${gold ? "Zehn goldene Regeln" : "Umgang mit Rückschlägen"}</h1>
    <div class="card stack" data-titel="${gold ? "Selbstgespräch" : "Rückschlag"}">
      ${gold
        ? `<p class="small">Zur Angstbewältigung, in der Ich-Form. Sie sind als Selbstgespräch
             gedacht – laut gelesen wirken sie besser als nur gedacht.</p>`
        : `<p class="small">Ein Rückschlag ist kein Rückfall in den Anfang. Er ist der Moment, in dem
             sich entscheidet, ob Vermeidung wieder wächst.</p>`}
      <ol class="regeln">${liste.map(r => `<li>${esc(r)}</li>`).join("")}</ol>
    </div>
    <div class="row">
      <button class="btn grow" data-go="${gold ? "regeln-rueckschlag" : "regeln"}">
        ${gold ? "Umgang mit Rückschlägen" : "Zehn goldene Regeln"}</button>
      <button class="btn grow" data-go-quest="${gold ? "goldene-regeln" : "rueckschlag-regeln"}">Als Übung machen</button>
    </div>
    <button class="btn ghost block" data-go="kurs">Zum Behandlungspfad</button>
  </div>`;
}

/* --- E.17  Handbuch ------------------------------------------------------

}

    <div class="card stack" data-titel="So läuft ein Tag">

        <p>Jeden Morgen schlägt die App drei Übungen vor: eine kurze, eine mittlere und eine
        Mut-Quest. Zusammen sind das etwa 15 bis 30 Minuten. Jede einzelne kannst du gegen eine

        <p>An drei Tagen pro Woche ist eine <strong>Elite-Aktivität</strong> dabei – etwas, das du

      <div style="overflow-x:auto">
        <table class="tabelle">
          <thead><tr><th>Stufe</th><th>Figur</th><th>Gesamtpunkte</th></tr></thead>
          <tbody>${stufen}</tbody>
        </table>
      </div>
      <p class="small muted">Deine Figur wird mit jeder Stufe größer, aufrechter und bekommt mehr

      ${abschnitt("Serie, Multiplikator und Ruhetag-Schilde", `
        <p>Für jeden Tag, an dem du mindestens eine Übung machst, wächst deine Serie. Sie erhöht die

      ${abschnitt("Mein Gipfel", `

        Vorhersage, danach vergleichst du sie mit dem, was tatsächlich passiert ist. Am Ende steht

        <p><strong>Abbrechen ist eingeplant und gibt Punkte</strong>, nicht null. Es soll nie einen

        <p>Alles, was du in Übungen aufschreibst, landet hier: Gedankenprotokolle, Panik-Protokolle,

    <div class="card stack" data-titel="Daten">

/* --- E.18  Medic ---------------------------------------------------------
   Information über pflanzliche Mittel. Bewusst ohne Dosierungen und ohne
   Empfehlung – die Entscheidung gehört in die Apotheke oder Arztpraxis.
   ------------------------------------------------------------------------ */
function datenlageBalken(n){
  const text = ["überwiegend Tradition", "einzelne kleinere Studien", "mehrere kontrollierte Studien"][n-1];
  return `<span class="datenlage" role="img" aria-label="Datenlage ${n} von 3: ${text}">
    ${[1,2,3].map(i => `<i class="${i<=n?'an':''}"></i>`).join("")}
    <span class="small">${esc(text)}</span></span>`;
}
function screenMedic(){
  return `<div class="stack" style="padding-top:14px">

        Ob etwas für dich passt – und ob es sich mit deinen anderen Medikamenten verträgt –,
        klärst du mit einer Ärztin oder in der Apotheke.</div>
      <p class="small"><strong>Pflanzlich heißt nicht harmlos.</strong> Pflanzliche Mittel haben
        Nebenwirkungen und Wechselwirkungen, teilweise erhebliche. Und sie sind nicht reguliert wie
        verschreibungspflichtige Arzneimittel: Bei Nahrungsergänzungsmitteln ist oft unklar, was
        tatsächlich drin ist.</p>
      <div class="bubble"><strong>Der wichtigste Punkt für diese App:</strong> Ein Mittel, das du
        nimmst, <em>damit du eine Situation aushältst</em>, wird zum Sicherheitsverhalten – und

      <ul class="small" style="padding-left:18px;margin:0">
        <li><strong>Kognitive Verhaltenstherapie mit Konfrontation</strong> – in den Leitlinien

/* ===========================================================================
   §G  INTERAKTION  ·  Atem, Timer, Formulare, Export/Import, Start
   =========================================================================== */

/* --- G.1  Atem-Engine ---------------------------------------------------
   Bei abgeschalteter Bewegung wird nur ein-/ausgeblendet und gezählt,
   die Blase bleibt still (Vorgabe aus prefers-reduced-motion).            */
let ATEM = { timer:null };
function atemStop(){
  if (ATEM.timer){ clearInterval(ATEM.timer); ATEM.timer = null; }
}
function atemStart(cfg, endlos){
  atemStop();
  const blase = $("#breath"), phaseEl = $("#breath-phase"), countEl = $("#breath-count");
  if (!blase) return;
  const ruhig = bewegungAus();
  const phasen = [{ name:"Einatmen", sek:cfg.ein, scale:1 }];
  if (cfg.halten) phasen.push({ name:"Halten", sek:cfg.halten, scale:1 });
  phasen.push({ name:"Ausatmen", sek:cfg.aus, scale:0.62 });
  const proRunde = phasen.reduce((a,p) => a + p.sek, 0);
  const maxRunden = endlos ? Infinity
    : (cfg.runden || Math.max(1, Math.round((cfg.minuten || 5) * 60 / proRunde)));

  let pi = 0, rest = phasen[0].sek, runde = 0;
  const anwenden = p => {
    if (ruhig){ blase.style.transform = "scale(1)"; blase.style.opacity = p.name === "Ausatmen" ? ".65" : "1"; }
    else { blase.style.transitionDuration = p.sek + "s"; blase.style.transform = "scale(" + p.scale + ")"; }
    phaseEl.textContent = p.name;
  };
  anwenden(phasen[0]); countEl.textContent = rest;
  ATEM.timer = setInterval(() => {
    rest--;
    if (rest <= 0){
      pi++;
      if (pi >= phasen.length){
        pi = 0; runde++;
        if (runde >= maxRunden){
          atemStop(); phaseEl.textContent = "Fertig"; countEl.textContent = "✓";
          melde("Atemübung beendet."); return;
        }
      }
      anwenden(phasen[pi]); rest = phasen[pi].sek;
    }
    countEl.textContent = rest;
  }, 1000);
}

/* --- G.2  Countdown ----------------------------------------------------- */
let TIMER = { id:null, rest:0, laeuft:false };
function timerSetzen(sek){
  TIMER.rest = sek;
  const el = $("#timer-anzeige");
  if (el) el.textContent = String(Math.floor(sek/60)).padStart(2,"0") + ":" + String(sek%60).padStart(2,"0");
}
function timerToggle(startSek){
  const btn = $("#btn-timer");
  if (TIMER.laeuft){
    clearInterval(TIMER.id); TIMER.laeuft = false; if (btn) btn.textContent = "Weiter";
    return;
  }
  if (!TIMER.rest) TIMER.rest = startSek;
  TIMER.laeuft = true; if (btn) btn.textContent = "Pause";
  TIMER.id = setInterval(() => {
    TIMER.rest--;
    timerSetzen(Math.max(0,TIMER.rest));
    if (TIMER.rest <= 0){
      clearInterval(TIMER.id); TIMER.laeuft = false;
      if (btn) btn.textContent = "Starten";
      toast("Zeit ist um – gut gemacht.");
      melde("Timer abgelaufen.");
    }
  }, 1000);
}

  $$("#view [data-feld]").forEach(el => {

}

/* --- G.5b  Mein Gipfel: Bedienung --------------------------------------- */
let DUHR = null;
function uhrStoppen(){ if (DUHR){ clearInterval(DUHR); DUHR = null; } }
/* Schieberegler mit Live-Beschriftung koppeln */
function regler(id, ausgabeId, nachher){
  const el = $("#"+id); if (!el) return;
  el.addEventListener("input", () => {
    const a = $("#"+ausgabeId); if (a) a.textContent = el.value;
    if (nachher) nachher(el.value);
  });
}

  uhrStoppen();

  const start = $("#btn-gipfel-start");
  if (start) start.addEventListener("click", () => { GSETUP = null; gehe("gipfel-setup"); });

  /* ---- Einrichtung ---- */

    GSETUP.zielSud = Number(v);

  });
  regler("gs-et-sud","gs-et-sud-wert");
  $$("[data-check]").forEach(c => c.addEventListener("change", () => {
    GSETUP.checks[Number(c.dataset.check)] = c.checked;
  }));
  const imp = $("#gs-import");
  if (imp) imp.addEventListener("click", () => {
    S.avoidanceMap.slice().sort((a,b)=>a.sud-b.sud).forEach(e => {
      if (!GSETUP.etappen.some(x => x.text === e.situation))
        GSETUP.etappen.push({ id:neueId(), text:e.situation, sud:e.sud, geplanteMin:20, ohneSicherheit:"" });

  const etAdd = $("#gs-et-add");
  if (etAdd) etAdd.addEventListener("click", () => {
    const t = $("#gs-et-text").value.trim();
    if (!t){ toast("Bitte eine Etappe eintragen."); return; }
    GSETUP.etappen.push({ id:neueId(), text:t, sud:Number($("#gs-et-sud").value),

  $$("[data-gs-del]").forEach(b => b.addEventListener("click", () => {

  }));
  $$("[data-gs]").forEach(b => b.addEventListener("click", () => {

    if (G.schritt === 0){
      G.titel = $("#gs-titel").value; G.warum = $("#gs-warum").value;

    }
    if (G.schritt === 2 && ziel === "3" && !G.etappen.length){
      toast("Mindestens eine Etappe – lieber eine kleine als keine."); return;
    }
    if (G.schritt === 3){
      G.ausstiegssatz = $("#gs-ausstieg").value;
      G.kontakt = $("#gs-kontakt").value;
      G.verbuendeter = $("#gs-verbuendeter").value;
    }
    if (ziel === "fertig"){ gipfelAnlegen(G); GSETUP = null; gehe("gipfel"); return; }

  /* ---- Durchgang ---- */

/* --- G.5  Quest eintragen ----------------------------------------------- */
function questEintragen(){
  const q = questById(QSTATE.id);
  if (!q) return;
  const note = ($("#quest-note") && $("#quest-note").value.trim()) || "";
  const felder = QSTATE.felder || {};

  /* Werkzeug-abhängige Nebenwirkungen */
  const typ = JOURNAL_TYP[q.tool];
  if (typ){
    const sauber = {};
    Object.keys(felder).forEach(k => { if (!k.startsWith("_")) sauber[k] = felder[k]; });
    if (Object.keys(sauber).length) journalEintrag(typ, sauber);
  }
  if (q.tool === "werte"){
    const eigen = felder.handlung;      // Wert selbst wird beim Antippen gespeichert
    if (eigen) { /* bereits im Journal */ }
  }
  if (q.tool === "sprosse" && felder._geschafft === "1" && felder.situation){
    const e = S.avoidanceMap.find(x => x.id === felder.situation);
    if (e){ e.status = "geschafft"; }
  }
  if (q.tool === "wissenskarte" && felder._wissenskarte){
    S.stats.letzteKarte = felder._wissenskarte;
  }
  speichern();

  questAbschliessen(q, {
    durationMin: q.dauerMin,
    moodBefore: QSTATE.moodBefore,
    moodAfter: QSTATE.moodAfter,
    note: note
  });
  QSTATE.phase = "fertig";
  render();
}

function sicherungGemerkt(){ S.stats.letzteSicherung = heute(); speichern(); }

function datenImportieren(ev){
  const datei = ev.target.files && ev.target.files[0];
  if (!datei) return;
  const leser = new FileReader();
  leser.onload = () => {
    try{
      const daten = JSON.parse(leser.result);
      if (!daten || typeof daten !== "object") throw new Error("Format");
      overlay(`<h2>Daten übernehmen?</h2>
        <p>Der aktuelle Stand auf diesem Gerät wird durch die Datei ersetzt.</p>
        <button class="btn ghost block" data-close>Abbrechen</button>
        <button class="btn primary block" id="btn-import-ok">Übernehmen</button>`);
      $("#btn-import-ok").addEventListener("click", () => {
        S = migrate(daten);
        speichern();
        $("#overlay-root").innerHTML = "";
        gehe("heim");
        toast("Daten geladen.");
      });
    }catch(e){
      toast("Diese Datei konnte nicht gelesen werden.");
    }
    ev.target.value = "";
  };
  leser.onerror = () => { toast("Datei konnte nicht gelesen werden."); };
  leser.readAsText(datei);
}

/* --- G.7  Ruhe-Insel binden --------------------------------------------- */
const GROUNDING_INSEL = [
  ["Sieh dich um. Fünf Dinge, die du sehen kannst.","Benenne sie – innerlich oder laut."],
  ["Hör hin. Vier Geräusche.","Auch leise zählen."],
  ["Spüre. Drei Dinge, die du fühlst.","Boden, Stoff, Temperatur."],
  ["Rieche. Zwei Dinge.","Wenn nichts da ist: an etwas Vertrautes denken."],
  ["Eine Sache, die du schmeckst.","Oder eine, die dir heute gefallen hat."]
];
function inselBinden(){
  const zu = $("#btn-insel-zu");
  if (zu) zu.addEventListener("click", inselSchliessen);
  $$("#island-root [data-insel]").forEach(b => b.addEventListener("click", () => {
    atemStop(); ISLAND_VIEW = b.dataset.insel; inselRendern();
  }));
  if (ISLAND_VIEW === "atem") atemStart({ ein:4, halten:0, aus:6 }, true);
  const gi = $("#gi-weiter");
  if (gi){
    let i = 0;
    gi.addEventListener("click", () => {
      i = (i+1) % GROUNDING_INSEL.length;
      $("#gi-titel").textContent = GROUNDING_INSEL[i][0];
      $("#gi-text").textContent  = GROUNDING_INSEL[i][1];
      $("#gi-nr").textContent    = i+1;
    });
  }
}

/* --- G.8  Globale Schalter ---------------------------------------------- */
$("#btn-panic").addEventListener("click", inselOeffnen);
/* Beim Scrollen kurz durchscheinend werden lassen. */
(() => {
  const knopf = $("#btn-panic");
  let zurueck = null;
  addEventListener("scroll", () => {
    knopf.classList.add("blass");
    clearTimeout(zurueck);
    zurueck = setTimeout(() => knopf.classList.remove("blass"), 800);
  }, { passive:true });
})();
$("#btn-settings").addEventListener("click", () => gehe("einstellungen"));
$("#btn-handbuch").addEventListener("click", () => gehe("handbuch"));
$("#btn-crisis").addEventListener("click", () => gehe("krisen"));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $(".island")) inselSchliessen();
});

/* --- G.9  Installierbarkeit ---------------------------------------------
   Der Service Worker macht die App offline startfähig. Registriert wird er
   nur, wenn die Seite wirklich von einem Server kommt: als Einzeldatei
   (file://) und eingebettet in einer fremden Seite gibt es keinen.
   Ohne ihn läuft alles unverändert – nur eben nicht ohne Netz.           */
if ("serviceWorker" in navigator &&
    /^https?:$/.test(location.protocol) &&
    window.top === window.self){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* --- G.10  Start --------------------------------------------------------- */
function start(){
  S = ladeState();
  const info = tagesUebergang();
  tagesplanSicherstellen();
  if (info.schild) setTimeout(() => toast(TEXTE.schildEingeloest), 600);
  document.body.classList.toggle("no-motion", !!S.settings.reducedMotion);
  render();
  if (!STORAGE_OK) melde("Speichern ist in diesem Browser nicht möglich.");
  /* Verknüpfung „Ruhe-Insel" vom Startbildschirm: ?ruhe=1 öffnet sie sofort. */
  try {
    if (new URLSearchParams(location.search).has("ruhe")) inselOeffnen();
  } catch(e){ /* alte Browser ohne URLSearchParams: einfach normal starten */ }
}
start();
</script>
